      ];
      function createCodeTexture() {
        // 画布必须用 2 的幂尺寸（2048×1024）：WebGL1 里非 2 的幂纹理配
        // REPEAT 环绕会被判为不完整、采样全黑——旧版 1920×1080 正是因此
        // 让代码层整层消失（只剩灰条假象）。行高 32 × 32 行正好铺满
        // 1024 高，纵向 REPEAT 滚动无缝。
        var W = 2048, H = 1024, LH = 32;
        var cv = document.createElement("canvas");
        cv.width = W; cv.height = H;
        var ctx = cv.getContext("2d");
        ctx.clearRect(0, 0, W, H);
        ctx.font = "21px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace";
        ctx.textBaseline = "top";
        var rows = H / LH; // 32 行，正好铺满一屏高、纵向无缝滚动
        function drawColumn(x, offset) {
          for (var row = 0; row < rows; row++) {
            var line = CODE_LINES[(row + offset) % CODE_LINES.length];
            if (!line) continue;
            var trim = line.replace(/^\s+/, "");
            if (trim.indexOf("//") === 0) ctx.fillStyle = "rgba(126, 178, 152, 1)";
            else if (trim.indexOf("const ") === 0 || trim.indexOf("function") === 0 ||
                     trim.indexOf("if ") === 0 || trim.indexOf("for ") === 0 ||
                     trim.indexOf("return") === 0 || trim.indexOf("import") === 0)
              ctx.fillStyle = "rgba(168, 216, 234, 1)";
            else if (trim.indexOf("'") !== -1 || trim.indexOf('"') !== -1)
              ctx.fillStyle = "rgba(240, 190, 220, 1)";
            else ctx.fillStyle = "rgba(178, 240, 214, 1)";
            ctx.fillText(line, x, row * LH + 6);
          }
        }
        drawColumn(28, 0);          // 左列：uv x 约 0.01–0.27
        drawColumn(1400, 23);       // 右列：uv x 约 0.68–0.94，与左列内容错开
        var tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.bindTexture(gl.TEXTURE_2D, null);
        return tex;
      }
      var codeTex = createCodeTexture();

      // 照片四边形几何（三角形带）
      var photoQuadPos = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, photoQuadPos);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.5, -0.5, 0.5, -0.5, -0.5, 0.5, 0.5, 0.5]), gl.STATIC_DRAW);
      var photoQuadUV = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, photoQuadUV);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);

      /* ============================================================
         照片贴片：拍立得卡片（默认节日卡 / 用户上传）
         全部在本机生成纹理，不上传、不保存
         ============================================================ */
      var MAX_PHOTOS = 24;
      var PHOTO_W = 0.07, PHOTO_H = 0.0875; // 世界单位（512×640 比例）— 散开时的小贴片，约为早期大卡的 1/3，只作粒子云里的微型缩略图
      var photos = []; // {tex, src, cap, treePos, angle, scatterPos, delay, tilt, scale, _sx, _sy, _vis}

      function makeTexture(source) {
        var tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.bindTexture(gl.TEXTURE_2D, null);
        return tex;
      }

      // 拍立得画布：白边 + 底部大边 + 可选题字
      function polaroidCanvas(drawInner, caption) {
        var cv = document.createElement("canvas");
        cv.width = 512; cv.height = 640;
        var ctx = cv.getContext("2d");
        ctx.fillStyle = "#fdfdf7";
        ctx.fillRect(0, 0, 512, 640);
        ctx.save();
        ctx.beginPath();
        ctx.rect(44, 44, 424, 424);
        ctx.clip();
        drawInner(ctx, 44, 44, 424, 424);
        ctx.restore();
        ctx.strokeStyle = "rgba(0,0,0,0.10)";
        ctx.lineWidth = 2;
        ctx.strokeRect(44, 44, 424, 424);
        if (caption) {
          ctx.fillStyle = "#6a6a60";
          ctx.font = "italic 30px Georgia, 'Songti SC', serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(caption, 256, 556);
        }
        return cv;
      }

      // 默认节日卡：渐变 + 图案 + 文字（无外部图片）
      function defaultCard(i) {
        var themes = [
          { g: ["#7a1020", "#c2273a"], t: "JOYEUX NOEL", cap: "Joyeux Noel" },
          { g: ["#0d4d2e", "#1d7a4a"], t: "MERRY CHRISTMAS", cap: "Merry Christmas" },
          { g: ["#8a6414", "#d9a441"], t: "天天开心", cap: "天天开心" },
          { g: ["#2c1e6e", "#6a3fb5"], t: "圣诞快乐", cap: "圣诞快乐" },
          { g: ["#0e3a5c", "#2a7ab0"], t: "平安喜乐", cap: "平安喜乐" },
          { g: ["#7c2050", "#c24d8a"], t: "MERRY & BRIGHT", cap: "Merry & Bright" }
        ];
        var th = themes[i % themes.length];
        var cv = polaroidCanvas(function (ctx, x, y, w, h) {
          var gr = ctx.createLinearGradient(x, y, x + w, y + h);
          gr.addColorStop(0, th.g[0]);
          gr.addColorStop(1, th.g[1]);
          ctx.fillStyle = gr;
          ctx.fillRect(x, y, w, h);
          // 雪点
          ctx.fillStyle = "rgba(255,255,255,0.5)";
          for (var k = 0; k < 46; k++) {
            ctx.beginPath();
            ctx.arc(x + Math.random() * w, y + Math.random() * h, 1.5 + Math.random() * 2.6, 0, 6.2832);
            ctx.fill();
          }
          // 小星
          ctx.fillStyle = "rgba(255,236,170,0.9)";
          for (var s = 0; s < 7; s++) {
            var sx = x + 30 + Math.random() * (w - 60), sy = y + 30 + Math.random() * (h - 60), r = 5 + Math.random() * 5;
            ctx.beginPath();
            for (var p = 0; p < 8; p++) {
              var a = p * Math.PI / 4 - Math.PI / 2, rr = p % 2 ? r * 0.38 : r;
              var px = sx + Math.cos(a) * rr, py = sy + Math.sin(a) * rr;
              if (p === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
          }
          // 主文字
          ctx.fillStyle = "#fff";
          ctx.shadowColor = "rgba(0,0,0,0.35)";
          ctx.shadowBlur = 10;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          var isZh = /[一-鿿]/.test(th.t);
          ctx.font = (isZh ? "bold 74px " : "bold 44px ") + "'PingFang SC','Microsoft YaHei',sans-serif";
          var words = th.t.split(" ");
          if (words.length === 2) {
            ctx.fillText(words[0], x + w / 2, y + h / 2 - 34);
            ctx.fillText(words[1], x + w / 2, y + h / 2 + 34);
          } else {
            ctx.fillText(th.t, x + w / 2, y + h / 2);
          }
          ctx.shadowBlur = 0;
        }, th.cap);
        return { canvas: cv, src: cv.toDataURL("image/png"), cap: th.cap };
      }

      function layoutPhotos() {
        var N = photos.length;
        for (var i = 0; i < N; i++) {
          var ph = photos[i];
          var h = 0.13 + 0.74 * ((i * 0.61803) % 1);
          var a = i * 2.39996; // 黄金角分布
          var r = radiusAt(h) * 1.03 + 0.05;
          ph.treePos = [Math.cos(a) * r, BASE_Y + h * TREE_H + 0.04, Math.sin(a) * r];
          ph.angle = a;
          // 散开位置：随机散布在粒子云团里，不再排成整齐的环
          var ra = Math.random() * Math.PI * 2;
          var rsc = rand(1.5, 3.3);
          ph.scatterPos = [Math.cos(ra) * rsc, rand(0.15, 3.15), Math.sin(ra) * rsc];
          ph.delay = (i % 8) / 8 * 0.5;
          ph.tilt = rand(-0.16, 0.16);
          ph.scale = rand(0.92, 1.1);
          ph._vis = false;
        }
      }

      var photosSource = "default"; // "default" | "builtin" | "user"
      var builtinLoadStarted = false;

      function setPhotos(list, source) {
        for (var i = 0; i < photos.length; i++) gl.deleteTexture(photos[i].tex);
        photos = list.map(function (item) {
          return {
            tex: makeTexture(item.canvas),
            src: item.src,
            cap: item.cap || "Merry Christmas",
            treePos: [0, 0, 0], scatterPos: [0, 0, 0],
            angle: 0, delay: 0, tilt: 0, scale: 1, _vis: false, _sx: 0, _sy: 0
          };
        });
        if (source) photosSource = source;
        layoutPhotos();
        if (typeof focusIndex !== "undefined" && focusIndex >= photos.length) closeFocus();
      }

      function initDefaultPhotos() {
        var list = [];
        for (var i = 0; i < 6; i++) list.push(defaultCard(i));
        setPhotos(list, "default");
      }

      /* ----- 内置照片：可选同目录文件 photos-data.js -----
         定义 window.BUILTIN_PHOTOS = [dataURI, ...]
         由正文末尾的动态加载器拉取（带缓存戳、失败/超时自动重试、
         不删脚本，晚到的加载结果由轮询兜底应用）。
         ?v=3 缓存戳用于绕开「文件部署之前浏览器缓存下来的 404」。
         文件缺失/失败时回退到节日卡；若用户已上传照片，则不覆盖。
         加载过程只打 console，不在页面上显示任何诊断 UI。 */
      var builtinSettled = false;

      function photoDiag(msg) {
        try { console.info("[builtin-photos] " + msg); } catch (e) {}
      }

      function applyBuiltinPhotos(dataUris) {
        if (photosSource === "user") return;
        if (!dataUris || !dataUris.length) return;
        var capped = dataUris.slice(0, MAX_PHOTOS);
        var loaded = new Array(capped.length);
        var done = 0;
        function checkDone() {
          if (++done !== capped.length) return;
          var list = [];
          for (var j = 0; j < loaded.length; j++) if (loaded[j]) list.push(loaded[j]);
          if (!list.length) { photoDiag("内置照片：加载失败，继续使用节日卡"); return; }
          if (photosSource === "user") return;
          photoDiag("内置照片：已加载 " + list.length + " 张", true);
          setPhotos(list, "builtin");
        }
        capped.forEach(function (uri, idx) {
          if (typeof uri !== "string" || uri.indexOf("data:") !== 0) { checkDone(); return; }
          var img = new Image();
          img.onload = function () {
            try {
              var cv = polaroidCanvas(function (ctx, x, y, w, h) {
                var s = Math.max(w / img.naturalWidth, h / img.naturalHeight);
                var dw = img.naturalWidth * s, dh = img.naturalHeight * s;
                ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
              }, "Merry Christmas");
              loaded[idx] = { canvas: cv, src: uri, cap: "Merry Christmas" };
            } catch (e) { /* skip this photo */ }
            checkDone();
          };
          img.onerror = function () { checkDone(); };
          img.src = uri;
        });
      }

      // BUILTIN_PHOTOS 已就绪则立即应用；返回是否已应用
      function builtinApply() {
        if (builtinSettled) return true;
        if (window.BUILTIN_PHOTOS && Object.prototype.toString.call(window.BUILTIN_PHOTOS) === "[object Array]" && window.BUILTIN_PHOTOS.length) {
          builtinSettled = true;
          applyBuiltinPhotos(window.BUILTIN_PHOTOS);
          return true;
        }
        return false;
      }

      function loadBuiltinPhotos() {
        if (builtinLoadStarted) return;
        builtinLoadStarted = true;
        // BUILTIN_PHOTOS 若已就绪（如被其它方式提前引入）— 直接用
        if (builtinApply()) return;
        photoDiag("内置照片：正在加载…");
        var attempts = 0;
        function tryLoad() {
          attempts++;
          var script = document.createElement("script");
          // ?v=3 绕开部署前缓存的 404；重试时再加随机戳强制回源
          script.src = "photos-data.js?v=3" + (attempts > 1 ? "&r=" + Date.now() : "");
          script.async = true;
          var done = false;
          var timer = setTimeout(function () {
            if (done) return;
            done = true;
            // 超时不删除脚本、也不放弃：它若晚到，执行后轮询仍会应用；
            // 同时再补发一次带新缓存戳的请求。
            if (attempts < 3) {
              photoDiag("内置照片：加载较慢，正在重试（第 " + (attempts + 1) + " 次）…");
              tryLoad();
            } else {
              photoDiag("内置照片：加载超时，继续使用节日卡");
            }
          }, 20000);
          script.onload = function () {
            if (done) return;
            done = true;
            clearTimeout(timer);
            if (!builtinApply()) {
              builtinSettled = true;
              photoDiag("内置照片：文件已加载但没有可用数据，继续使用节日卡");
            }
          };
          script.onerror = function () {
            if (done) return;
            done = true;
            clearTimeout(timer);
            if (attempts < 3) {
              setTimeout(tryLoad, 1200);
            } else {
              photoDiag("内置照片：未找到 photos-data.js，继续使用节日卡");
            }
          };
          document.head.appendChild(script);
        }
        tryLoad();
        // 兜底轮询：超时后晚到的脚本一旦执行、让 BUILTIN_PHOTOS
        // 出现，立即应用；最多等约 90 秒。
        var pollCount = 0;
        var poll = setInterval(function () {
          if (builtinSettled || ++pollCount > 45) { clearInterval(poll); return; }
          builtinApply();
        }, 2000);
      }

      /* ----- 照片放大层（点照片或捏合手势打开，点任意处关闭） ----- */
      var focusOverlay = document.getElementById("focusOverlay");
      var focusImg = document.getElementById("focusImg");
      var focusCap = document.getElementById("focusCap");
      var focusIndex = -1;

      function openFocus(i) {
        if (i < 0 || i >= photos.length) return;
        focusIndex = i;
        focusImg.src = photos[i].src;
        focusCap.textContent = photos[i].cap;
        focusOverlay.classList.remove("on");
        void focusOverlay.offsetWidth; // 重启动画
        focusOverlay.classList.add("on");
      }
      function closeFocus() {
        focusIndex = -1;
        focusOverlay.classList.remove("on");
      }
      function cycleFocus() {
        if (!photos.length) return;
        if (focusIndex < 0) {
          // 首选离屏幕中心最近的可见照片；聚成树时照片不可见，无可放大
          var best = -1, bd = 1e9, cx = window.innerWidth / 2, cy = window.innerHeight / 2;
          for (var i = 0; i < photos.length; i++) {
            if (!photos[i]._vis) continue;
            var d = Math.hypot(photos[i]._sx - cx, photos[i]._sy - cy);
            if (d < bd) { bd = d; best = i; }
          }
          if (best < 0) { toast("先散开，照片会以小图出现在粒子云里，点任意一张可放大"); return; }
          openFocus(best);
        } else {
          openFocus((focusIndex + 1) % photos.length);
        }
      }
      focusOverlay.addEventListener("click", function () { closeFocus(); });

      /* ----- 绘制照片贴片 ----- */
      function basisMatrix(right, up, nrm, pos, w, h) {
        return new Float32Array([
          right[0] * w, right[1] * w, right[2] * w, 0,
          up[0] * h, up[1] * h, up[2] * h, 0,
          nrm[0], nrm[1], nrm[2], 0,
          pos[0], pos[1], pos[2], 1
        ]);
      }
      var _tv = [0, 0, 0];
      function drawPhotos(viewM, eye, yawEff, time) {
        if (!photos.length) return;
        // 可见性规则：聚成树时照片完全不显示；只在散开（接近完成）时以小贴片出现，
        // 聚合过程中随 scatterCur 下降螺旋收进树里并缩小消失
        var photoVis = smoothstep(0.30, 0.72, scatterCur);
        if (photoVis <= 0.01) {
          for (var vi = 0; vi < photos.length; vi++) photos[vi]._vis = false;
          return;
        }
        var camRight = [viewM[0], viewM[4], viewM[8]];
        var camUp = [viewM[1], viewM[5], viewM[9]];
        gl.useProgram(photoProg.pr);
        var U = photoProg.U;
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.bindBuffer(gl.ARRAY_BUFFER, photoQuadPos);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, photoQuadUV);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 0, 0);
        gl.uniform1i(U.uTex, 0);
        gl.activeTexture(gl.TEXTURE0);

        for (var i = 0; i < photos.length; i++) {
          var ph = photos[i];
          if (i === focusIndex) { ph._vis = false; continue; } // 已在放大层里
          var lt = clamp(scatterCur * 1.5 - ph.delay * 0.5, 0, 1);
          lt = lt * lt * (3 - 2 * lt);
          var lp = vLerp(ph.treePos, ph.scatterPos, lt);
          // 进出途中绕树轴螺旋：散开时旋出、聚合时旋入树身
          var spinA = (1 - lt) * 2.4;
          if (spinA) {
            var csx = Math.cos(spinA), snx = Math.sin(spinA);
            var lx = lp[0] * csx - lp[2] * snx, lz = lp[0] * snx + lp[2] * csx;
            lp[0] = lx; lp[2] = lz;
          }
          lp[1] += Math.sin(time * 0.8 + i * 1.37) * 0.05 * lt; // 散开时轻轻漂浮
          // 模型旋转（与粒子同一套 yaw + 横向偏移）
          rotY(lp, yawEff, _tv);
          var wp = [_tv[0] + view.offX, _tv[1], _tv[2]];
          // 树形态朝向：沿径向朝外、略上仰；散开时转向镜头
          var nl = vNorm([Math.cos(ph.angle), 0.35, Math.sin(ph.angle)]);
          rotY(nl, yawEff, _tv);
          var nt = [_tv[0], _tv[1], _tv[2]];
          var rt = vNorm(vCross([0, 1, 0], nt));
          var ut = vCross(nt, rt);
          var toCam = vNorm([eye[0] - wp[0], eye[1] - wp[1], eye[2] - wp[2]]);
          var nb = toCam;
          var rb = camRight, ub = camUp;
          var right = vNorm(vLerp(rt, rb, lt));
          var upv = vLerp(ut, ub, lt);
          var nrm = vNorm(vCross(right, upv));
          upv = vCross(nrm, right);
          // 轻微滚转（散开时减弱）
          var roll = ph.tilt * (1 - lt * 0.6);
          if (roll) {
            var cr = Math.cos(roll), sr = Math.sin(roll);
            var r2 = [right[0] * cr + upv[0] * sr, right[1] * cr + upv[1] * sr, right[2] * cr + upv[2] * sr];
            var u2 = [upv[0] * cr - right[0] * sr, upv[1] * cr - right[1] * sr, upv[2] * cr - right[2] * sr];
            right = r2; upv = u2;
          }
          // 背向镜头的照片淡出，避免穿帮
          var facing = nrm[0] * toCam[0] + nrm[1] * toCam[1] + nrm[2] * toCam[2];
          var alpha = clamp(smoothstep(-0.15, 0.25, facing), 0, 1) * 0.98 * photoVis;
          if (alpha < 0.02) { ph._vis = false; continue; }
          var M = basisMatrix(right, upv, nrm, wp, PHOTO_W * ph.scale * photoVis, PHOTO_H * ph.scale * photoVis);
          var MVP = mMul(view.proj, mMul(viewM, M));
          gl.uniformMatrix4fv(U.uMVP, false, MVP);
          gl.uniform1f(U.uAlpha, alpha);
          gl.bindTexture(gl.TEXTURE_2D, ph.tex);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          // 记录屏幕坐标，供点选 / 捏合选片
          var cx = MVP[12] / MVP[15], cy = MVP[13] / MVP[15];
          ph._sx = (cx * 0.5 + 0.5) * window.innerWidth;
          ph._sy = (0.5 - cy * 0.5) * window.innerHeight;
          ph._vis = alpha > 0.25 && photoVis > 0.5;
        }
        gl.disableVertexAttribArray(0);
        gl.disableVertexAttribArray(1);
        gl.bindTexture(gl.TEXTURE_2D, null);
        gl.blendFunc(gl.ONE, gl.ONE);
      }

      /* ============================================================
         相机 / 交互 / 动画状态
         ============================================================ */
      var FOV = 36 * Math.PI / 180;
      var view = { w: 1, h: 1, dpr: 1, proj: null, scaleF: 1, offX: 0, targetY: 1.52, halo: [0.585, 0.80], baseDist: 8.0 };

      var zoomF = 1.0, elevation = 0.26;
      var yaw = 0, pitchDrag = 0;
      var autoRotate = !REDUCED;
      var formStart = performance.now();
      var INTRO_TUNNEL_MS = 3200; // 开场隧道段：树粒子还停在球壳起点，先只看光流
      var INTRO_FORM_MS = 5900;   // 汇聚成形段（与隧道段合计约 9.1 秒）

      // 手势形态状态：0 = 树，1 = 散开
      var scatterCur = 0, scatterTarget = 0;
      // 手部位置跟随（平滑后的偏移量）
      var yawHand = 0, pitchHand = 0, handYawTarget = 0, handPitchTarget = 0, handPresent = false;

      function resize() {
        view.dpr = Math.min(window.devicePixelRatio || 1, 2);
        view.w = Math.floor(canvas.clientWidth * view.dpr);
        view.h = Math.floor(canvas.clientHeight * view.dpr);
        canvas.width = view.w;
        canvas.height = view.h;
        gl.viewport(0, 0, view.w, view.h);
        var aspect = view.w / view.h;
        view.proj = mPerspective(FOV, aspect, 0.1, 140);
        view.scaleF = view.h / (2 * Math.tan(FOV / 2));
        if (aspect > 1.12) {
          view.offX = 0.55; view.targetY = 1.52; view.halo = [0.585, 0.80];
          view.baseDist = 8.0;
        } else {
          view.offX = 0; view.targetY = 1.62; view.halo = [0.5, 0.68];
          // 竖屏横向视野窄：按树宽反推距离，保证整棵树 + 地面光环入框
          view.baseDist = Math.max(8.0, 2.4 / (Math.tan(FOV / 2) * aspect));
        }
      }
      window.addEventListener("resize", resize);
      resize();

      /* ----- 形态切换（仅手势驱动：张手散开 / 握拳成树） ----- */
      function doScatter() {
        scatterTarget = 1;
        closeFocus();
      }
      function doAssemble() {
        scatterTarget = 0;
        closeFocus();
      }

      /* 拖动旋转 + 滚轮 / 双指缩放 + 点选照片 */
      var pointers = new Map();
      var lastPinch = 0;
      var downInfo = null;
      canvas.addEventListener("pointerdown", function (e) {
        canvas.setPointerCapture(e.pointerId);
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        lastPinch = 0;
        if (pointers.size === 1) downInfo = { x: e.clientX, y: e.clientY, t: performance.now() };
      });
      canvas.addEventListener("pointermove", function (e) {
        if (!pointers.has(e.pointerId)) return;
        var prev = pointers.get(e.pointerId);
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointers.size === 1) {
          yaw -= (e.clientX - prev.x) * 0.0052;
          pitchDrag = clamp(pitchDrag + (e.clientY - prev.y) * 0.0032, -0.30, 0.55);
        } else if (pointers.size === 2) {
          var pts = Array.from(pointers.values());
          var d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          if (lastPinch > 0) zoomF = clamp(zoomF * (lastPinch / d), 0.55, 1.7);
          lastPinch = d;
        }
      });
      function endPointer(e) {
        var wasSingle = pointers.size === 1 && pointers.has(e.pointerId);
        pointers.delete(e.pointerId);
        lastPinch = 0;
        // 轻点（几乎没移动）→ 命中照片就放大
        if (wasSingle && downInfo &&
            performance.now() - downInfo.t < 400 &&
            Math.hypot(e.clientX - downInfo.x, e.clientY - downInfo.y) < 9) {
          var best = -1, bd = 80;
          for (var i = 0; i < photos.length; i++) {
            if (!photos[i]._vis) continue;
            var d = Math.hypot(photos[i]._sx - e.clientX, photos[i]._sy - e.clientY);
            if (d < bd) { bd = d; best = i; }
          }
          if (best >= 0) openFocus(best);
        }
        downInfo = null;
      }
      canvas.addEventListener("pointerup", endPointer);
      canvas.addEventListener("pointercancel", endPointer);
      canvas.addEventListener("wheel", function (e) {
        e.preventDefault();
        zoomF = clamp(zoomF * (e.deltaY > 0 ? 1.09 : 0.92), 0.55, 1.7);
      }, { passive: false });

      /* ============================================================
         手势识别：MediaPipe Hands（页面加载即自动启动摄像头，
         再从 CDN 懒加载识别库，全程本地运行）
         摄像头画面只在本机处理，绝不上传；启动失败静默进入仅观看模式
         ============================================================ */
      var camNote = document.getElementById("camNote");
      var camWrap = document.getElementById("camWrap");
      var camVideo = document.getElementById("camVideo");
      var camCanvas = document.getElementById("camCanvas");
      var camCtx = camCanvas.getContext("2d");
      var camStatus = { textContent: "" }; // 手势角标已随预览小窗移除，保留空壳承接状态写入
      var camOn = false, camBusy = false, camStarting = false;
      var handsObj = null, mediaStream = null, camRAF = 0, sendBusy = false;
      var recogRunning = false, recogFailed = false, sendFailCount = 0;

      var HAND_EDGES = [
        [0, 1], [1, 2], [2, 3], [3, 4],
        [0, 5], [5, 6], [6, 7], [7, 8],
        [5, 9], [9, 10], [10, 11], [11, 12],
        [9, 13], [13, 14], [14, 15], [15, 16],
        [13, 17], [17, 18], [18, 19], [19, 20], [0, 17]
      ];
      var GESTURE_LABEL = { open: "张手", fist: "握拳", pinch: "捏合", none: "无" };
      var gCandidate = "none", gCandidateSince = 0, gCommitted = "none";

      var handsBase = null;
      var HANDS_CDNS = [
        "https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240",
        "https://unpkg.com/@mediapipe/hands@0.4.1675469240"
      ];

      function withTimeout(promise, ms, label) {
        return Promise.race([
          Promise.resolve(promise),
          new Promise(function (_, reject) {
            setTimeout(function () {
              var e = new Error("timeout after " + ms + "ms: " + label);
              e.name = "TimeoutError";
              reject(e);
            }, ms);
          })
        ]);
      }

      function loadScript(src, timeoutMs) {
        return new Promise(function (resolve, reject) {
          if (window.Hands) { resolve(); return; }
          var s = document.createElement("script");
          var timer = setTimeout(function () {
            s.onload = s.onerror = null;
            reject(new Error("timeout loading " + src));
          }, timeoutMs || 15000);
          s.src = src;
          s.async = true;
          s.onload = function () { clearTimeout(timer); resolve(); };
          s.onerror = function () { clearTimeout(timer); reject(new Error("load failed: " + src)); };
          document.head.appendChild(s);
        });
      }

      // 先预检某个 CDN 上的关键方案文件（脚本配套的 binarypb + 资产 loader），
      // 预检不过直接换下一个 CDN，保证 hands.js 与 locateFile 的 WASM/模型同源同版本
      function preflightBase(base) {
        var files = ["hands.binarypb", "hands_solution_packed_assets_loader.js", "hand_landmark_lite.tflite"];
        var chain = Promise.resolve();
        files.forEach(function (f) {
          chain = chain.then(function () {
            return withTimeout(fetch(base + "/" + f, { method: "HEAD" }), 8000, "preflight " + f)
              .then(function (r) {
                if (!r.ok) throw new Error("preflight " + f + " HTTP " + r.status + " @ " + base);
              });
          });
        });
        return chain;
      }

      // 依次尝试多个 CDN（脚本 + 方案文件成套预检），全部失败才算 hands-load 失败
      function loadHandsWithFallback() {
        if (window.Hands && handsBase) return Promise.resolve(handsBase);
        var idx = 0;
        function attempt() {
          if (idx >= HANDS_CDNS.length) {
            var e = new Error("all MediaPipe CDNs failed (script + solution assets)");
            e.name = "HandsLoadError";
            throw e;
          }
          var base = HANDS_CDNS[idx++];
          return preflightBase(base).then(function () {
            return loadScript(base + "/hands.js", 15000);
          }).then(function () {
            if (!window.Hands) throw new Error("Hands global missing after load from " + base);
            handsBase = base;
            console.log("[gesture] MediaPipe Hands loaded from", base);
            return base;
          }).catch(function (err) {
            console.warn("[gesture] CDN failed, trying next:", base, err);
            return attempt();
          });
        }
        return attempt();
      }

      function classifyGesture(lm) {
        function d(a, b) {
          var dx = lm[a].x - lm[b].x, dy = lm[a].y - lm[b].y;
          return Math.sqrt(dx * dx + dy * dy);
        }
        var scale = d(0, 9) || 0.0001;
        if (d(4, 8) / scale < 0.35) return "pinch"; // 拇指尖贴食指尖
        var fingers = [[8, 6], [12, 10], [16, 14], [20, 18]];
        var ext = 0;
        for (var i = 0; i < 4; i++) {
          if (d(fingers[i][0], 0) > d(fingers[i][1], 0) * 1.12) ext++;
        }
        if (ext >= 4) return "open";
        if (ext <= 1) return "fist";
        return "none";
      }

      function commitGesture(g) {
        gCommitted = g;
        camStatus.textContent = "当前手势：" + (GESTURE_LABEL[g] || "无");
        if (g === "open") doScatter();
        else if (g === "fist") doAssemble();
        else if (g === "pinch") cycleFocus();
      }

      function onHandResults(results) {
        camCtx.clearRect(0, 0, camCanvas.width, camCanvas.height);
        var list = results.multiHandLandmarks;
        if (!list || !list.length) {
          handPresent = false;
          handYawTarget = 0;
          handPitchTarget = 0;
          var now0 = performance.now();
          if (gCandidate !== "none") { gCandidate = "none"; gCandidateSince = now0; }
          else if (gCommitted !== "none" && now0 - gCandidateSince > 350) commitGesture("none");
          return;
        }
        var lm = list[0];
        handPresent = true;
        // 骨架线（画布与预览同为镜像显示）
        camCtx.strokeStyle = "rgba(120,220,255,0.85)";
        camCtx.lineWidth = 2;
        camCtx.beginPath();
        for (var e = 0; e < HAND_EDGES.length; e++) {
          var a = lm[HAND_EDGES[e][0]], b = lm[HAND_EDGES[e][1]];
          camCtx.moveTo(a.x * camCanvas.width, a.y * camCanvas.height);
          camCtx.lineTo(b.x * camCanvas.width, b.y * camCanvas.height);
        }
        camCtx.stroke();
        camCtx.fillStyle = "#ffd76a";
        for (var p = 0; p < 21; p++) {
          camCtx.beginPath();
          camCtx.arc(lm[p].x * camCanvas.width, lm[p].y * camCanvas.height, 2.6, 0, 6.2832);
          camCtx.fill();
        }
        // 手掌位置 → 视角跟随（x 取镜像，和用户看到的预览一致）
        var palm = lm[9];
        var ux = 1 - palm.x, uy = palm.y;
        handYawTarget = (ux - 0.5) * 2.6;
        handPitchTarget = clamp((0.5 - uy) * 0.6, -0.25, 0.45);
        // 手势去抖：稳定约 350ms 才生效
        var g = classifyGesture(lm);
        var now = performance.now();
        if (g !== gCandidate) { gCandidate = g; gCandidateSince = now; }
        else if (g !== gCommitted && now - gCandidateSince > 350) commitGesture(g);
      }

      function camLoop() {
        if (!camOn) return;
        camRAF = requestAnimationFrame(camLoop);
        if (!sendBusy && camVideo.readyState >= 2 && handsObj && recogRunning) {
          sendBusy = true;
          handsObj.send({ image: camVideo }).catch(function (e) {
            sendFailCount++;
            console.warn("[gesture] hands.send failed (" + sendFailCount + "):", e);
            if (sendFailCount === 3) {
              camStatus.textContent = "摄像头已开 · 识别暂不可用";
            }
          }).then(function () {
            sendBusy = false;
          });
        }
      }

      /* 摄像头启动失败：静默进入仅观看模式，只留底部一行小字提示 */
      function failCamera(err) {
        camStarting = false;
        console.warn("[gesture] camera unavailable, view-only mode:", err);
        if (mediaStream) {
          mediaStream.getTracks().forEach(function (t) { t.stop(); });
          mediaStream = null;
        }
        camVideo.srcObject = null;
        camNote.classList.add("on");
      }

      /* 识别失败：摄像头流保持运行，仅记录状态、不显示任何提示 */
      function recogFail(stepIdx, err) {
        recogRunning = false;
        recogFailed = true;
        console.warn("[gesture] recognition unavailable:", err);
        camStatus.textContent = "摄像头已开 · 识别暂不可用";
      }

      /* 识别链：与摄像头完全解耦，失败不影响预览 */
      function startRecognition() {
        if (recogRunning) return;
        if (handsObj) { // 已初始化过，直接恢复送帧
          recogRunning = true;
          recogFailed = false;
          camStatus.textContent = "当前手势：无";
          camLoop();
          return;
        }
        recogRunning = true;
        recogFailed = false;
        sendFailCount = 0;
        loadHandsWithFallback().then(function (base) {
          if (!camOn) { recogRunning = false; return; }
          try {
            handsObj = new window.Hands({
              locateFile: function (f) { return (handsBase || base) + "/" + f; }
            });
            handsObj.setOptions({
              maxNumHands: 1,
              modelComplexity: 0,
              minDetectionConfidence: 0.7,
              minTrackingConfidence: 0.5
            });
            handsObj.onResults(onHandResults);
          } catch (initErr) {
            recogFail(4, initErr, "hands-init");
            return;
          }
          var initP = (typeof handsObj.initialize === "function")
            ? handsObj.initialize() : Promise.resolve();
          withTimeout(initP, 30000, "Hands.initialize (WASM/模型)").then(function () {
            if (!camOn) { recogRunning = false; return; }
            camStatus.textContent = "当前手势：无";
            camLoop();
          }).catch(function (e) { recogFail(4, e, "hands-init"); });
        }).catch(function (e) { recogFail(3, e, "hands-load"); });
      }

      // One getUserMedia attempt; converts synchronous throws (old Safari / WebViews)
      // into rejections so a single .catch path handles both.
      function gumAttempt(constraints) {
        try {
          return Promise.resolve(navigator.mediaDevices.getUserMedia(constraints));
        } catch (syncErr) {
          return Promise.reject(syncErr);
        }
      }
      /* 页面加载即自动启动：getUserMedia 是第一个异步调用（最简参数，
         兼容性优先），预览先行显示，识别库随后异步加载；
         任何失败都静默落到仅观看模式，不弹面板、不留按钮 */
      function startCamera() {
        if (camOn || camStarting) return;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          camNote.classList.add("on");
          return;
        }
        camStarting = true;
        var gumPromise = gumAttempt({ video: true, audio: false }).catch(function (firstErr) {
          var n = (firstErr && firstErr.name) || "";
          if (n === "OverconstrainedError" || n === "NotFoundError" || n === "DevicesNotFoundError") {
            return gumAttempt({ video: true });
          }
          throw firstErr;
        });
        // 超时后若流才到，直接关掉避免摄像头灯常亮
        gumPromise.then(function (s) {
          if (!camOn && !camStarting && s) s.getTracks().forEach(function (t) { t.stop(); });
        }, function () {});
        withTimeout(gumPromise, 20000, "getUserMedia").then(function (stream) {
          mediaStream = stream;
          camVideo.srcObject = stream;
          var playP;
          try { playP = camVideo.play(); } catch (e) { playP = null; }
          return Promise.resolve(playP).catch(function () {});
        }).then(function () {
          if (!mediaStream) return;
          // 到这里摄像头就算完全打开（画面离屏隐藏），识别库之后再异步加载
          camOn = true;
          camStarting = false;
          camWrap.classList.add("on");
          camWrap.setAttribute("aria-hidden", "false");
          camStatus.textContent = "当前手势：无";
          gCandidate = "none"; gCommitted = "none";
          startRecognition();
        }).catch(function (err) {
          failCamera(err);
        });
      }

      function stopCamera() {
        camOn = false;
        camStarting = false;
        recogRunning = false;
        sendBusy = false;
        cancelAnimationFrame(camRAF);
        if (mediaStream) {
          mediaStream.getTracks().forEach(function (t) { t.stop(); });
          mediaStream = null;
        }
        camVideo.srcObject = null;
        camWrap.classList.remove("on");
        camWrap.setAttribute("aria-hidden", "true");
        handPresent = false;
        handYawTarget = 0;
        handPitchTarget = 0;
        gCommitted = "none";
      }
      // 打开页面就申请摄像头权限，与形成动画并行，无需任何点击
      startCamera();

      initDefaultPhotos();
      // Async, non-blocking: try to replace festival cards with built-in
      // photos from sibling photos-data.js if present (GitHub Pages copy).
      // Missing / failed / timeout falls back silently to festival cards.
      loadBuiltinPhotos();

      /* ============================================================
         渲染
         ============================================================ */
      function drawPoints(up, mv, opts) {
        gl.useProgram(ptProg.pr);
        var U = ptProg.U;
        gl.uniformMatrix4fv(U.uProj, false, view.proj);
        gl.uniformMatrix4fv(U.uMV, false, mv);
        gl.uniform1f(U.uTime, opts.time);
        gl.uniform1f(U.uForm, opts.form);
        gl.uniform1f(U.uScatter, opts.scatter == null ? scatterCur : opts.scatter);
        gl.uniform1f(U.uScale, view.scaleF);
        gl.uniform1f(U.uSizeMul, opts.sizeMul || 1);
        gl.uniform1f(U.uBrightMul, opts.bright || 1);
        gl.uniform1f(U.uSway, opts.sway || 0);
        gl.uniform1f(U.uTwinkle, opts.twinkle || 0);
        gl.uniform1f(U.uPulse, opts.pulse || 1);
        gl.uniform1f(U.uAlpha, opts.alpha == null ? 1 : opts.alpha);
        gl.uniform1f(U.uTravel, opts.travel || 0.40);
        gl.uniform1f(U.uSwirl, opts.swirl == null ? 5.2 : opts.swirl);
        gl.uniform1f(U.uArc, opts.arc == null ? 0.5 : opts.arc);
        bindSystem(ptProg, up);
        gl.drawArrays(gl.POINTS, 0, up.n);
        unbindSystem();
      }

      // 辉光点（开场光核专用 coreProg，径向衰减在贴图内归零、无方框边）
      function drawGlowPoints(bufs, count, mv, alpha, r, g, b) {
        gl.useProgram(coreProg.pr);
        gl.uniformMatrix4fv(coreProg.U.uProj, false, view.proj);
        gl.uniformMatrix4fv(coreProg.U.uMV, false, mv);
        gl.uniform1f(coreProg.U.uScale, view.scaleF);
        gl.uniform1f(coreProg.U.uA, alpha);
        gl.uniform3f(coreProg.U.uColor, r, g, b);
        gl.bindBuffer(gl.ARRAY_BUFFER, bufs[0]);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, bufs[1]);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 0, 0);
        gl.drawArrays(gl.POINTS, 0, count);
        gl.disableVertexAttribArray(0);
        gl.disableVertexAttribArray(1);
      }

      var lastT = performance.now();
      function frame(now) {
        requestAnimationFrame(frame);
        var dt = Math.min(0.05, (now - lastT) / 1000);
        lastT = now;
        var time = now / 1000;
        var elapsedF = now - formStart;
        // 形成进度：隧道段（前约 3.2 秒）保持 0，之后约 5.9 秒完成汇聚成形
        var form = REDUCED ? 1 : clamp((elapsedF - INTRO_TUNNEL_MS) / INTRO_FORM_MS, 0, 1);
        // 隧道段树体不可见，汇聚开始后随球壳一起淡入
        var introA = REDUCED ? 1 : smoothstep(2600, 3900, elapsedF);
        // 背景点缀（流星 / 烟花）的总闸门：只在形成动画完成后淡入，此后常驻循环
        var lifeA = REDUCED ? 1 : smoothstep(INTRO_TUNNEL_MS + INTRO_FORM_MS, INTRO_TUNNEL_MS + INTRO_FORM_MS + 1600, elapsedF);
        // 形态插值（约 1.5–2 秒平滑过渡，聚合带螺旋汇聚）
        scatterCur += (scatterTarget - scatterCur) * (1 - Math.exp(-dt * 2.1));
        if (Math.abs(scatterTarget - scatterCur) < 0.001) scatterCur = scatterTarget;
        // 手部跟随平滑
        var follow = 1 - Math.exp(-dt * 4);
        yawHand += (handYawTarget - yawHand) * follow;
        pitchHand += (handPitchTarget - pitchHand) * follow;

        if (autoRotate && pointers.size === 0) yaw += dt * 0.10;
        var yawEff = yaw + yawHand;

        var camDist = view.baseDist * zoomF;
        if (!REDUCED) {
          // 隧道段明显推镜：从 1.20 倍距离缓缓推近到正常，配合光流的穿越感
          var pushT = clamp(elapsedF / 4200, 0, 1);
          camDist *= 1.20 - 0.20 * (pushT * pushT * (3 - 2 * pushT));
        }
        var el = elevation + pitchDrag + pitchHand;
        var eye = [0, view.targetY + camDist * Math.sin(el), camDist * Math.cos(el)];
        var viewM = mLookAt(eye, [0, view.targetY, 0], [0, 1, 0]);
        var modelM = mModel(view.offX, yawEff, 0);
        var mvTree = mMul(viewM, modelM);
        var mvTop = mMul(viewM, mModel(view.offX, 0, 0));
        // 树顶爱心呼吸：整体亮度 + 尺寸随正弦脉动；散开后随粒子云飘散
        var topPulse = 1 + 0.13 * (0.5 + 0.5 * Math.sin(time * 2.3)) - 0.065;
        var mvTopEff = scatterCur > 0.01 ? mvTree : mvTop;

        gl.disable(gl.DEPTH_TEST);
        gl.disable(gl.BLEND);
        gl.clear(gl.DEPTH_BUFFER_BIT); // 遮挡体每帧重写深度，先清（须在 depthMask 关闭前）
        gl.depthMask(false);

        /* 背景 */
        gl.useProgram(bgProg.pr);
        gl.uniform1f(bgProg.U.uTime, time);
        gl.uniform2f(bgProg.U.uHalo, view.halo[0], view.halo[1]);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, codeTex);
        if (bgProg.U.uCodeTex) gl.uniform1i(bgProg.U.uCodeTex, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, bgBuf);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.disableVertexAttribArray(0);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE);

        /* 背景星 */
        drawPoints(stars, viewM, { time: time, form: 1, scatter: 0, twinkle: 0.45, bright: 0.9 });

        /* 开场序列（约 9.1 秒）：时空隧道光流 + 细尘（约 3.4 秒，中心光核小而暗）→
           球壳扩散（与隧道尾段重叠交融）→ 树粒子螺旋汇聚、自下而上成形、爱心最后淡入 */
        if (!REDUCED) {
          var tunnelT = clamp(elapsedF / 3400, 0, 1);
          if (tunnelT < 1) {
            gl.useProgram(tunnelProg.pr);
            gl.uniformMatrix4fv(tunnelProg.U.uProj, false, view.proj);
            gl.uniformMatrix4fv(tunnelProg.U.uMV, false, mvTop);
            gl.uniform1f(tunnelProg.U.uT, tunnelT);
            var tSizes = [4, 1, 1];
            for (var ti = 0; ti < 3; ti++) {
              gl.bindBuffer(gl.ARRAY_BUFFER, tunnelBufs[ti]);
              gl.enableVertexAttribArray(ti);
              gl.vertexAttribPointer(ti, tSizes[ti], gl.FLOAT, false, 0, 0);
            }
            gl.drawArrays(gl.LINES, 0, tunnelData.n * 2);
            for (var tj = 0; tj < 3; tj++) gl.disableVertexAttribArray(tj);
            // 细尘点流：与光线同场冲过镜头
            gl.useProgram(tptProg.pr);
            gl.uniformMatrix4fv(tptProg.U.uProj, false, view.proj);
            gl.uniformMatrix4fv(tptProg.U.uMV, false, mvTop);
            gl.uniform1f(tptProg.U.uT, tunnelT);
            gl.uniform1f(tptProg.U.uScale, view.scaleF);
            var dSizes = [4, 1, 1];
            for (var di = 0; di < 3; di++) {
              gl.bindBuffer(gl.ARRAY_BUFFER, tdBufs[di]);
              gl.enableVertexAttribArray(di);
              gl.vertexAttribPointer(di, dSizes[di], gl.FLOAT, false, 0, 0);
            }
            gl.drawArrays(gl.POINTS, 0, tdData.n);
            for (var dj = 0; dj < 3; dj++) gl.disableVertexAttribArray(dj);
          }
          // 光核：小而暗，只轻轻呼吸，隧道后段到球壳初段之间淡出
          var coreT = elapsedF / 4000;
          if (coreT > 0 && coreT < 1) {
            var coreA = 0.20 * clamp(coreT / 0.10, 0, 1) * (1 - smoothstep(0.70, 1.0, coreT)) *
              (0.85 + 0.15 * Math.sin(time * 7.0));
            if (coreA > 0.004) drawGlowPoints(coreBufs, CORE_N, mvTop, coreA, 1.05, 0.36, 0.74);
          }
          var shellT = clamp((elapsedF - 2900) / 2700, 0, 1);
          if (shellT > 0 && shellT < 1) {
            gl.useProgram(shellProg.pr);
            gl.uniformMatrix4fv(shellProg.U.uProj, false, view.proj);
            gl.uniformMatrix4fv(shellProg.U.uMV, false, mvTop);
            gl.uniform1f(shellProg.U.uT, shellT);
            gl.uniform1f(shellProg.U.uScale, view.scaleF);
            var shSizes = [3, 3, 1];
            for (var si = 0; si < 3; si++) {
              gl.bindBuffer(gl.ARRAY_BUFFER, shellBufs[si]);
              gl.enableVertexAttribArray(si);
              gl.vertexAttribPointer(si, shSizes[si], gl.FLOAT, false, 0, 0);
            }
            gl.drawArrays(gl.POINTS, 0, shellData.n);
            for (var sj = 0; sj < 3; sj++) gl.disableVertexAttribArray(sj);
          }
        }

        /* 背景点缀：烟花 + 流星（只在形成动画完成后淡入，此后循环；
           绘于树身之前、衬在背景层，不随树旋转） */
        if (lifeA > 0.01) {
          gl.useProgram(fwProg.pr);
          var FU = fwProg.U;
          gl.uniformMatrix4fv(FU.uProj, false, view.proj);
          gl.uniformMatrix4fv(FU.uMV, false, mvTop);
          gl.uniform1f(FU.uTime, time);
          gl.uniform1f(FU.uScale, view.scaleF);
          gl.uniform1f(FU.uGate, lifeA);
          var fwSizes = [3, 3, 3, 1, 1, 1];
          for (var fi = 0; fi < 6; fi++) {
            gl.bindBuffer(gl.ARRAY_BUFFER, fwBufs[fi]);
            gl.enableVertexAttribArray(fi);
            gl.vertexAttribPointer(fi, fwSizes[fi], gl.FLOAT, false, 0, 0);
          }
          gl.drawArrays(gl.POINTS, 0, fwData.n);
          for (var fj = 0; fj < 6; fj++) gl.disableVertexAttribArray(fj);

          gl.useProgram(meteorProg.pr);
          var MU = meteorProg.U;
          gl.uniformMatrix4fv(MU.uProj, false, view.proj);
          gl.uniformMatrix4fv(MU.uMV, false, mvTop);
          gl.uniform1f(MU.uTime, time);
          gl.uniform1f(MU.uScale, view.scaleF);
          gl.uniform1f(MU.uGate, lifeA);
          var mtSizes = [3, 3, 4];
          for (var mi = 0; mi < 3; mi++) {
            gl.bindBuffer(gl.ARRAY_BUFFER, meteorBufs[mi]);
            gl.enableVertexAttribArray(mi);
            gl.vertexAttribPointer(mi, mtSizes[mi], gl.FLOAT, false, 0, 0);
          }
          gl.drawArrays(gl.POINTS, 0, meteorData.n);
          for (var mj = 0; mj < 3; mj++) gl.disableVertexAttribArray(mj);
        }

        /* 地面微光点 + 轨道环（散开时变淡） */
        drawPoints(ground, mvTree, { time: time, form: form, sizeMul: 1.0, twinkle: 0.5, bright: 0.5, alpha: (1 - 0.7 * scatterCur) * 0.85 * introA });
        drawPoints(rings, mvTree, { time: time, form: form, sizeMul: 1.1, bright: 0.8, twinkle: 0.35, alpha: (1 - 0.85 * scatterCur) * introA });

        /* 树干 */
        drawPoints(trunk, mvTree, { time: time, form: form, twinkle: 0.1, bright: 0.9, travel: 0.42, alpha: introA });

        /* 树叶：大光晕 + 亮芯两遍（强闪烁出闪粉感；本轮整体提亮——芯光与
           光晕都上调，树身明显更亮更通透，仍保持粉色梯度与层间层次） */
        drawPoints(leaves, mvTree, { time: time, form: form, sizeMul: 2.2, bright: 0.09, sway: 0.008, twinkle: 0.4, arc: 0.55, alpha: introA });
        drawPoints(leaves, mvTree, { time: time, form: form, sizeMul: 1.0, bright: 0.80, sway: 0.008, twinkle: 0.75, arc: 0.55, alpha: introA });
        /* 形成中的拖尾残影：同一批粒子以稍早的进度再画两遍淡影，读作流光拖尾 */
        if (form < 1 && !REDUCED) {
          drawPoints(leaves, mvTree, { time: time, form: Math.max(0, form - 0.045), sizeMul: 1.5, bright: 0.16, sway: 0.008, twinkle: 0.5, arc: 0.55, alpha: introA });
          drawPoints(leaves, mvTree, { time: time, form: Math.max(0, form - 0.09), sizeMul: 1.9, bright: 0.08, sway: 0.008, twinkle: 0.5, arc: 0.55, alpha: introA });
        }

        /* 遮挡体：与树身同轴的隐形圆锥（半径为树表的 93%）先行写深度、不写颜色；
           随后光带在深度测试开启下绘制——背面的带段被深度挡掉，任意角度只见近侧。
           遮挡半径随形成进度长入、随散开收回，过渡不跳变；树身粒子本身不测深度、
           不受影响，遮挡体也永不着色。 */
        var occF = clamp((form - 0.55) / 0.45, 0, 1) * (1 - smoothstep(0.0, 0.35, scatterCur));
        var useOcc = occF > 0.01;
        if (useOcc) {
          gl.enable(gl.DEPTH_TEST);
          gl.depthFunc(gl.LEQUAL);
          gl.depthMask(true);
          gl.colorMask(false, false, false, false);
          gl.disable(gl.BLEND);
          gl.useProgram(occProg.pr);
          gl.uniformMatrix4fv(occProg.U.uProj, false, view.proj);
          gl.uniformMatrix4fv(occProg.U.uMV, false, mvTree);
          gl.uniform1f(occProg.U.uRad, occF);
          gl.bindBuffer(gl.ARRAY_BUFFER, occPosBuf);
          gl.enableVertexAttribArray(0);
          gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, occIdxBuf);
          gl.drawElements(gl.TRIANGLES, occIndexCount, gl.UNSIGNED_SHORT, 0);
          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null);
          gl.disableVertexAttribArray(0);
          gl.colorMask(true, true, true, true);
          gl.depthMask(false);
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.ONE, gl.ONE);
          // DEPTH_TEST 保持开启，供紧接着的光带绘制做遮挡测试
        }
        /* 单条螺旋光带（绕树四圈，点缀）：柔光晕 + 芯光两遍，尺寸/亮度都低于树身 */
        drawPoints(ribbon, mvTree, { time: time, form: form, sizeMul: 1.9, bright: 0.09, twinkle: 0.3, travel: 0.34, arc: 0.35, alpha: introA });
        drawPoints(ribbon, mvTree, { time: time, form: form, sizeMul: 1.0, bright: 0.60, twinkle: 0.35, travel: 0.34, arc: 0.35, alpha: introA });
        /* 金色铃铛挂饰：与光带同在遮挡体深度测试下绘制——正面的金点
           在树表之外、通过测试清晰闪烁；背面的被树身深度挡掉 */
        drawPoints(ornaments, mvTree, { time: time, form: form, sizeMul: 2.3, bright: 0.16, twinkle: 0.55, arc: 0.55, alpha: introA });
        drawPoints(ornaments, mvTree, { time: time, form: form, sizeMul: 1.0, bright: 1.15, twinkle: 0.85, arc: 0.55, alpha: introA });
        if (useOcc) gl.disable(gl.DEPTH_TEST);

        /* 浮尘 */
        drawPoints(dust, mvTree, { time: time, form: 1, scatter: 0, sway: 0.05, twinkle: 0.4, bright: 0.55, alpha: 0.8 });

        /* 树顶爱心：柔光晕 + 本体（小角度螺旋轻轻落位、呼吸脉动，无点火闪光） */
        drawPoints(topper, mvTopEff, { time: time, form: form, sizeMul: 4.2, bright: 0.12, pulse: topPulse, twinkle: 0.12, travel: 0.18, swirl: 1.3, arc: 0.05, alpha: introA });
        drawPoints(topper, mvTopEff, { time: time, form: form, sizeMul: 1.15, bright: 1.05, pulse: topPulse, twinkle: 0.12, travel: 0.18, swirl: 1.3, arc: 0.05, alpha: introA });

        /* 星芒 */
        gl.useProgram(spProg.pr);
        var SU = spProg.U;
        gl.uniformMatrix4fv(SU.uProj, false, view.proj);
        gl.uniformMatrix4fv(SU.uMV, false, mvTree);
        gl.uniform1f(SU.uTime, time);
        gl.uniform1f(SU.uForm, form);
        gl.uniform1f(SU.uScatter, scatterCur);
        gl.uniform1f(SU.uScale, view.scaleF);
        gl.uniform1f(SU.uTravel, 0.38);
        gl.uniform1f(SU.uSwirl, 5.2);
        gl.uniform1f(SU.uArc, 0.4);
        bindSystem(spProg, sparkles);
        gl.drawArrays(gl.POINTS, 0, sparkles.n);
        unbindSystem();

        /* 照片贴片（普通混合，内部切回加色混合） */
        drawPhotos(viewM, eye, yawEff, time);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
