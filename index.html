<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>粒子圣诞树</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        background: #0d0214;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      #scene:active { cursor: grabbing; }

      .greeting {
        position: fixed;
        left: 6vw;
        top: 27%;
        z-index: 5;
        pointer-events: none;
        color: #fff;
      }
      .greeting h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", "Songti SC", serif;
        font-style: italic;
        font-weight: 500;
        font-size: clamp(34px, 4.6vw, 66px);
        letter-spacing: 0.015em;
        line-height: 1.12;
        color: #fff7fb;
        text-shadow:
          0 0 14px rgba(255, 190, 225, 0.9),
          0 0 42px rgba(255, 120, 200, 0.5),
          0 0 90px rgba(190, 90, 255, 0.35);
      }
      /* 摄像头未授权时的唯一提示：一行低调小字，无按钮、无面板 */
      #camNote {
        position: fixed;
        left: 50%;
        bottom: calc(10px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 6;
        display: none;
        font-size: 11.5px;
        letter-spacing: 0.05em;
        color: rgba(243, 205, 240, 0.55);
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
        white-space: nowrap;
        pointer-events: none;
      }
      #camNote.on { display: block; }

      /* 摄像头画面不显示：video 仅供手势识别取帧，离屏隐藏（不用 display:none，
         避免个别浏览器暂停帧投递）；无预览小窗、无手势角标 */
      #camWrap, #camWrap.on {
        position: fixed;
        left: -9999px;
        top: 0;
        width: 2px;
        height: 2px;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
      }
      .mirror {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #camVideo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #camCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* 照片放大层 */
      #focusOverlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(3, 4, 16, 0.74);
        padding: 20px;
      }
      #focusOverlay.on { display: flex; }
      .focusCard {
        position: relative;
        background: #fdfdf8;
        padding: 12px 12px 42px;
        border: 3px solid #f0a8cf;
        border-radius: 6px;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4),
          0 0 46px rgba(240, 168, 207, 0.45),
          0 24px 60px rgba(0, 0, 0, 0.6);
        animation: focusIn 0.38s cubic-bezier(0.2, 0.9, 0.3, 1.18);
      }
      .focusCard img {
        display: block;
        max-width: min(76vw, 480px);
        max-height: 58vh;
        object-fit: contain;
        background: #10101c;
      }
      .focusCap {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 12px;
        text-align: center;
        color: #5a5a52;
        font-size: 13px;
        letter-spacing: 0.14em;
      }
      @keyframes focusIn {
        from { transform: scale(0.5); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }

      #toast {
        position: fixed;
        top: calc(14px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        z-index: 30;
        display: none;
        max-width: 88vw;
        padding: 9px 16px;
        border-radius: 999px;
        border: 1px solid rgba(255, 170, 220, 0.35);
        background: rgba(24, 4, 36, 0.88);
        color: #fceef8;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-align: center;
      }
      #toast.on { display: block; }

      .fallback {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        color: #f6e3f6;
        background: radial-gradient(120% 100% at 50% 20%, #2a0a44 0%, #0d0214 70%);
        font-size: 15px;
        line-height: 1.8;
      }

      @media (max-width: 680px) {
        .greeting {
          left: 20px;
          top: calc(20px + env(safe-area-inset-top));
        }
        .greeting h1 { font-size: clamp(30px, 9vw, 42px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .focusCard { animation: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="粒子圣诞树动画"></canvas>

    <div class="greeting">
      <h1>Merry Christmas</h1>
    </div>

    <div id="camNote">摄像头未授权，仅可观看</div>

    <div id="camWrap" aria-hidden="true">
      <div class="mirror">
        <video id="camVideo" playsinline muted></video>
        <canvas id="camCanvas" width="320" height="240"></canvas>
      </div>
    </div>

    <div id="focusOverlay">
      <div class="focusCard">
        <img id="focusImg" alt="放大的照片" />
        <div class="focusCap" id="focusCap">Merry Christmas</div>
      </div>
    </div>

    <div id="toast"></div>

    <div class="fallback" id="fallback">
      <div>这台设备的浏览器没有开启 WebGL，<br />粒子圣诞树暂时没法发光 ✨<br />换个较新的浏览器打开试试。</div>
    </div>

    <script>
      "use strict";
      /* ============================================================
         粒子圣诞树 — 粉色闪粉粒子树（参考抖音 @Zyw0605_ 的粒子引擎演示）
         粉色粒子树身（主体）/ 单条四圈螺旋光带（点缀，背面被深度遮挡）/ 树身金色铃铛点缀 / 粉色爱心树顶 /
         轨道环树基 / 开场时空隧道 / 形成后背景流星与烟花 / 代码纹理背景（全程）/ 浮尘
         + 手势识别（MediaPipe Hands，本地运行）+ 照片贴片
         ============================================================ */

      var REDUCED = window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      /* ---------- 小型矩阵 / 向量工具 ---------- */
      function mPerspective(fovRad, aspect, near, far) {
        var f = 1 / Math.tan(fovRad / 2), nf = 1 / (near - far);
        return new Float32Array([
          f / aspect, 0, 0, 0,
          0, f, 0, 0,
          0, 0, (far + near) * nf, -1,
          0, 0, 2 * far * near * nf, 0
        ]);
      }
      function mLookAt(eye, center, up) {
        var zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
        var zl = Math.hypot(zx, zy, zz); zx /= zl; zy /= zl; zz /= zl;
        var xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
        var xl = Math.hypot(xx, xy, xz) || 1; xx /= xl; xy /= xl; xz /= xl;
        var yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
        return new Float32Array([
          xx, yx, zx, 0,
          xy, yy, zy, 0,
          xz, yz, zz, 0,
          -(xx * eye[0] + xy * eye[1] + xz * eye[2]),
          -(yx * eye[0] + yy * eye[1] + yz * eye[2]),
          -(zx * eye[0] + zy * eye[1] + zz * eye[2]), 1
        ]);
      }
      function mMul(a, b) {
        var o = new Float32Array(16);
        for (var c = 0; c < 4; c++) for (var r = 0; r < 4; r++) {
          var s = 0;
          for (var k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
          o[c * 4 + r] = s;
        }
        return o;
      }
      function mModel(tx, yaw, pitch) {
        var cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
        // T * Rx(pitch) * Ry(yaw)
        return new Float32Array([
          cy, sp * sy, -cp * sy, 0,
          0, cp, sp, 0,
          sy, -sp * cy, cp * cy, 0,
          tx, 0, 0, 1
        ]);
      }
      // 与 mModel(0 俯仰) 一致的绕 Y 旋转
      function rotY(v, yaw, out) {
        var cy = Math.cos(yaw), sy = Math.sin(yaw);
        out[0] = cy * v[0] - sy * v[2];
        out[1] = v[1];
        out[2] = sy * v[0] + cy * v[2];
        return out;
      }
      function vNorm(v) {
        var l = Math.hypot(v[0], v[1], v[2]) || 1;
        return [v[0] / l, v[1] / l, v[2] / l];
      }
      function vCross(a, b) {
        return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
      }
      function vLerp(a, b, t) {
        return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
      }

      function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
      function lerp(a, b, t) { return a + (b - a) * t; }
      function smoothstep(a, b, x) {
        var t = clamp((x - a) / (b - a), 0, 1);
        return t * t * (3 - 2 * t);
      }
      function rand(a, b) { return a + Math.random() * (b - a); }

      /* ---------- 轻提示 ---------- */
      var toastEl = document.getElementById("toast");
      var toastTimer = 0;
      function toast(msg, ms) {
        toastEl.textContent = msg;
        toastEl.classList.add("on");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove("on"); }, ms || 3400);
      }

      /* ---------- 树叶颜色梯度（单色粉：底部深品红 → 顶部近白粉） ---------- */
      var STOPS = [
        [0.00, 0.66, 0.14, 0.50],
        [0.30, 0.88, 0.26, 0.62],
        [0.58, 1.00, 0.46, 0.76],
        [0.80, 1.04, 0.66, 0.88],
        [1.00, 1.12, 0.92, 1.04]
      ];
      function gradColor(h, out) {
        h = clamp(h, 0, 1);
        for (var i = 0; i < STOPS.length - 1; i++) {
          var a = STOPS[i], b = STOPS[i + 1];
          if (h <= b[0]) {
            var t = (h - a[0]) / (b[0] - a[0]);
            out[0] = lerp(a[1], b[1], t);
            out[1] = lerp(a[2], b[2], t);
            out[2] = lerp(a[3], b[3], t);
            return out;
          }
        }
        out[0] = 1.12; out[1] = 0.92; out[2] = 1.04;
        return out;
      }

      /* ============================================================
         几何生成：每个粒子输出
         pos0（形成前散开）/ pos1（树形态）/ pos2（手势散开云团）
         color / size / phase / delay
         ============================================================ */
      var TREE_H = 3.55, BASE_Y = -0.34, BASE_R = 1.08, TIP_Y = BASE_Y + TREE_H;
      function radiusAt(h) {
        var r = BASE_R * Math.pow(Math.max(0, 1 - h), 0.8);
        if (h > 0.90) r *= 1 - (h - 0.90) / 0.10 * 0.55; // 树尖收锐
        return r;
      }
      function scattered(p, kMin, kMax, noise) {
        var k = rand(kMin, kMax);
        return [
          p[0] * k + rand(-noise, noise),
          p[1] * k + rand(-noise, noise) + rand(0, 0.35),
          p[2] * k + rand(-noise, noise)
        ];
      }
      // 手势「散开」目标：以树心为中心的球状云团
      function cloudTarget() {
        var th = Math.random() * Math.PI * 2;
        var ph = Math.acos(rand(-1, 1));
        var r = rand(2.3, 3.85);
        var sp = Math.sin(ph);
        return [
          Math.cos(th) * sp * r,
          1.55 + Math.cos(ph) * r * 0.82,
          Math.sin(th) * sp * r
        ];
      }
      // 形成动画起点：以树心为中心的扩散球壳，粒子从壳上螺旋汇聚成树
      function shellStart() {
        var th = Math.random() * Math.PI * 2;
        var ph = Math.acos(rand(-1, 1));
        var r = rand(3.0, 5.0);
        var sp = Math.sin(ph);
        return [Math.cos(th) * sp * r, 1.5 + Math.cos(ph) * r * 0.8, Math.sin(th) * sp * r];
      }
      function makeSystem(n) {
        return {
          n: n,
          pos0: new Float32Array(n * 3),
          pos1: new Float32Array(n * 3),
          pos2: new Float32Array(n * 3),
          col: new Float32Array(n * 3),
          size: new Float32Array(n),
          phase: new Float32Array(n),
          delay: new Float32Array(n)
        };
      }
      function setP(sys, i, p0, p1, p2, c, size) {
        sys.pos0.set(p0, i * 3);
        sys.pos1.set(p1, i * 3);
        sys.pos2.set(p2, i * 3);
        sys.col.set(c, i * 3);
        sys.size[i] = size;
        sys.phase[i] = rand(0, Math.PI * 2);
        sys.delay[i] = Math.random() * 0.45;
      }

      /* ----- 树叶：8 层柔和波浪裙边圆锥（层间重叠大、台阶柔化） ----- */
      function buildLeaves(count) {
        var sys = makeSystem(count), c = [0, 0, 0];
        var TIERS = 10, tierSpan = TREE_H / TIERS;
        // 按层表面积加权选层（下层更大）
        var weights = [], wSum = 0, i, t;
        for (i = 0; i < TIERS; i++) {
          var w = radiusAt((i + 0.5) / TIERS) + 0.25;
          weights.push(w); wSum += w;
        }
        for (i = 0; i < count; i++) {
          var pick = Math.random() * wSum, tier = 0;
          while (pick > weights[tier]) { pick -= weights[tier]; tier++; }
          var tierTopY = BASE_Y + (tier + 1) * tierSpan * 0.94;
          var tierH = tierSpan * 1.34; // 层间重叠加大，轮廓呈柔和波浪而非硬台阶
          var s = Math.pow(Math.random(), 0.62); // 偏向裙边
          var rim = Math.random() < 0.20; // 裙边亮 rim 粒子
          if (rim) s = rand(0.93, 1.0);
          var yTopH = (tierTopY - BASE_Y) / TREE_H;
          var yBotH = (tierTopY - tierH - BASE_Y) / TREE_H;
          // 柔和扇贝轮廓：层顶略收、层底外张，半径随 s 平滑外翻
          var rTop = radiusAt(clamp(yTopH, 0, 1)) * 0.88;
          var rBot = radiusAt(clamp(yBotH, 0, 1)) * 1.18;
          var r = lerp(rTop, rBot, Math.pow(s, 1.55)) + Math.sin(s * Math.PI) * 0.035 * rBot;
          var droop = 0.10 * smoothstep(0.78, 1.0, s) * (0.5 + rBot / BASE_R * 0.7);
          var y = tierTopY - s * tierH - droop;
          var ang = Math.random() * Math.PI * 2;
          var vol = !rim && Math.random() < 0.52; // 内部体积粒子：过半占比，填满树身成近实心闪粉团
          var rr = r * rand(0.80, 1.0); // 体积感：内层略暗
          if (rim) rr = r * rand(1.0, 1.04);
          else if (vol) rr = r * (0.12 + 0.88 * Math.pow(Math.random(), 0.6));
          var p1 = [Math.cos(ang) * rr, y, Math.sin(ang) * rr];
          var h = clamp((y - BASE_Y) / TREE_H, 0, 1);
          gradColor(h, c);
          var bright = 0.55 + 0.45 * (rr / Math.max(r, 0.001));
          if (s < 0.25) bright *= 0.66; // 层间凹处略压暗，保留柔和波浪层次
          if (s > 0.78) bright *= 1.3; // 裙边更亮
          if (rim) bright *= 1.45;
          bright *= rand(0.82, 1.12);
          if (vol) bright *= 0.78;
          var col = [c[0] * bright, c[1] * bright, c[2] * bright];
          var size = rand(0.0095, 0.019); // 细密小点，闪粉质感（粒子数提高后点径略收，保持细颗粒）
          if (vol) size = rand(0.009, 0.017);
          if (Math.random() < 0.05) { // 近白粉色闪点
            var fb = rand(1.15, 1.5);
            col = [1.02 * fb, 0.88 * fb, 0.97 * fb];
            size = rand(0.017, 0.026);
          }
          setP(sys, i, shellStart(), p1, cloudTarget(), col, size);
          sys.delay[i] = 0.14 + h * 0.34 + Math.random() * 0.05; // 下层先落位、上层后到
        }
        return sys;
      }

      /* ----- 树干：深品红棕渐变，基本被树冠遮住 ----- */
      function buildTrunk(count) {
        var sys = makeSystem(count);
        for (var i = 0; i < count; i++) {
          var y = rand(-0.38, 0.22);
          var ang = Math.random() * Math.PI * 2;
          var rr = rand(0.02, 0.10) * (1 - (y + 0.38) * 0.5);
          var p1 = [Math.cos(ang) * rr, y, Math.sin(ang) * rr];
          var t = (y + 0.38) / 0.6;
          var col = [lerp(0.55, 0.85, t) * 0.85, lerp(0.22, 0.42, t) * 0.8, lerp(0.42, 0.62, t) * 0.85];
          setP(sys, i, shellStart(), p1, cloudTarget(), col, rand(0.016, 0.028));
          sys.delay[i] = 0.10 + Math.random() * 0.12;
        }
        return sys;
      }

      /* ----- 地面：暗色地面上稀疏的粉白微光点（散开时留在原地，只变淡） ----- */
      function buildGround(discCount) {
        var sys = makeSystem(discCount);
        for (var i = 0; i < discCount; i++) {
          var ang = Math.random() * Math.PI * 2;
          var rr = 2.5 * Math.sqrt(Math.random());
          var p1 = [Math.cos(ang) * rr, -0.375 + rand(-0.008, 0.014), Math.sin(ang) * rr];
          var fade = 1 - rr / 2.7;
          var b = rand(0.15, 0.7) * (0.2 + fade * 0.8);
          var col = [1.0 * b, 0.78 * b, 0.92 * b];
          setP(sys, i, scattered(p1, 1.6, 2.2, 0.5), p1, p1, col, rand(0.010, 0.020));
          sys.delay[i] = Math.random() * 0.18;
        }
        return sys;
      }

      /* ----- 树基轨道环：3 圈倾斜的细椭圆环（土星环式，淡粉白、低亮度） ----- */
      function buildRings(count) {
        var sys = makeSystem(count);
        var radii = [1.5, 1.9, 2.3];
        var per = [0.28, 0.34, 0.38]; // 按周长分配
        for (var i = 0; i < count; i++) {
          var pick = Math.random(), ri = radii[2], acc = 0;
          for (var k = 0; k < 3; k++) { acc += per[k]; if (pick <= acc) { ri = radii[k]; break; } }
          var a2 = Math.random() * Math.PI * 2;
          var r2 = ri + rand(-0.03, 0.03); // 窄带才成“圈”
          // 绕 X 轴倾斜：y 随 sin(a) 起伏，呈椭圆轨道感
          var p1 = [Math.cos(a2) * r2, -0.365 + Math.sin(a2) * r2 * 0.21 + rand(-0.004, 0.004), Math.sin(a2) * r2 * 0.98];
          var b = rand(0.45, 0.95);
          var col = [1.02 * b, 0.84 * b, 0.96 * b];
          setP(sys, i, scattered(p1, 1.6, 2.2, 0.5), p1, p1, col, rand(0.010, 0.018));
          sys.delay[i] = 0.06 + Math.random() * 0.14;
        }
        return sys;
      }

      /* ----- 螺旋光带：一条连续螺旋带，自下而上绕树 4 圈、螺距均匀，
         从正面看它 4 次横穿树面；贴在树表之外约 0.10，细而暗，只作花环
         点缀——主体永远是粒子树身；背面带段由遮挡体深度裁掉（见渲染段） ----- */
      function buildRibbon(count) {
        var sys = makeSystem(count);
        for (var i = 0; i < count; i++) {
          var t = Math.random(); // 0 树底 → 1 树顶（沿这唯一一条带均匀分布）
          var ang = t * Math.PI * 2 * 4 + rand(-0.016, 0.016); // 一条带绕 4 圈，抖动收紧：带身细而连续
          var y = BASE_Y + 0.05 + t * (TREE_H - 0.16) + rand(-0.008, 0.008);
          var h = clamp((y - BASE_Y) / TREE_H, 0, 1);
          var r = radiusAt(h) + 0.10 + rand(-0.006, 0.006); // 贴在树表之外约 0.10
          var p1 = [Math.cos(ang) * r, y, Math.sin(ang) * r];
          var b = rand(0.72, 1.08);
          var col = [1.07 * b, 0.79 * b, 0.97 * b]; // 亮度低于树身芯光，只作花环点缀
          setP(sys, i, shellStart(), p1, cloudTarget(), col, rand(0.013, 0.021));
          sys.delay[i] = 0.24 + t * 0.34 + Math.random() * 0.03; // 光带自下而上最后绕完
        }
        return sys;
      }

      /* ----- 树顶：粉色爱心（参数曲线填充），正对镜头不随树旋转，
         形成末段轻轻落位淡入 + 呼吸脉动，无点火闪光 ----- */
      var HEART_CY = TIP_Y + 0.34;
      function buildTopper(count) {
        var sys = makeSystem(count);
        var S = 0.0215; // 心形曲线缩放：宽约 ±0.344、高约 0.62
        for (var i = 0; i < count; i++) {
          var th = Math.random() * Math.PI * 2;
          var hx = 16 * Math.pow(Math.sin(th), 3);
          var hy = 13 * Math.cos(th) - 5 * Math.cos(2 * th) - 2 * Math.cos(3 * th) - Math.cos(4 * th);
          var cx = 0, cy = -0.03; // 曲线质心近似（原始坐标系）
          var f = Math.sqrt(Math.random()); // 向心填充：f=0 心、f=1 轮廓
          var x = (cx + (hx - cx) * f) * S;
          var y = (cy + (hy - cy) * f) * S;
          var z = rand(-1, 1) * 0.05 * (1 - f * f);
          var p1 = [x, HEART_CY + y, z];
          var core = smoothstep(0.75, 0.0, f); // 心部近白粉、边缘饱和粉
          var col = [
            lerp(1.06, 1.28, core),
            lerp(0.42, 0.92, core),
            lerp(0.70, 1.02, core)
          ];
          setP(sys, i, shellStart(), p1, cloudTarget(), col, rand(0.013, 0.024));
          sys.delay[i] = 0.76 + Math.random() * 0.05; // 爱心最后轻轻淡入
        }
        return sys;
      }

      /* ----- 星芒：贴在树表面的四角星 ----- */
      function buildSparkles(count) {
        var sys = makeSystem(count);
        var cWhite = [1.08, 1.02, 1.05], cLight = [1.05, 0.82, 0.95],
            cPink = [1.0, 0.55, 0.82], cDeep = [1.0, 0.38, 0.68];
        for (var i = 0; i < count; i++) {
          var h = Math.pow(Math.random(), 0.9);
          var y = BASE_Y + h * TREE_H * 0.985;
          var r = radiusAt(h) * rand(0.97, 1.03);
          var ang = Math.random() * Math.PI * 2;
          var p1 = [Math.cos(ang) * r, y, Math.sin(ang) * r];
          var pick = Math.random();
          var col = pick < 0.55 ? cWhite : pick < 0.78 ? cLight : pick < 0.92 ? cPink : cDeep;
          var hero = Math.random() < 0.045;
          var size = hero ? rand(0.15, 0.21) : rand(0.05, 0.095);
          setP(sys, i, shellStart(), p1, cloudTarget(), col.slice(), size);
          sys.phase[i] = rand(0, Math.PI * 2);
          sys.delay[i] = 0.20 + h * 0.38 + Math.random() * 0.05;
        }
        return sys;
      }

      /* ----- 金色铃铛 / 挂饰：贴在树身表面的暖金大点，像圣诞树上挂的铃铛，
         明显大于树叶粒子、各自轻轻闪烁；随树身一起形成 / 散开，
         绘制时与光带共用遮挡体深度——背面的金点被树身挡掉，只见正面 ----- */
      function buildOrnaments(count) {
        var sys = makeSystem(count);
        for (var i = 0; i < count; i++) {
          var h = Math.pow(Math.random(), 0.85); // 全高分布，略偏下半
          var y = BASE_Y + 0.06 + h * (TREE_H - 0.22);
          var hh = clamp((y - BASE_Y) / TREE_H, 0, 1);
          var r = radiusAt(hh) * rand(0.99, 1.05); // 贴在表面、略微探出
          var ang = Math.random() * Math.PI * 2; // 全角度均匀
          var p1 = [Math.cos(ang) * r, y, Math.sin(ang) * r];
          var gb = rand(0.85, 1.3); // #ffd98a 暖金，带个体亮度差
          var col = [1.30 * gb, 1.02 * gb, 0.52 * gb];
          setP(sys, i, shellStart(), p1, cloudTarget(), col, rand(0.030, 0.052));
          sys.delay[i] = 0.16 + hh * 0.36 + Math.random() * 0.05; // 随树身自下而上落位
        }
        return sys;
      }

      /* ----- 空气浮尘 ----- */
      function buildDust(count) {
        var sys = makeSystem(count);
        var palette = [[1.0, 0.78, 0.92], [1.0, 0.62, 0.85], [0.92, 0.82, 1.0], [1.0, 0.92, 0.97]];
        for (var i = 0; i < count; i++) {
          var ang = Math.random() * Math.PI * 2;
          var rr = rand(0.4, 3.1);
          var p1 = [Math.cos(ang) * rr, rand(-0.3, 3.9), Math.sin(ang) * rr];
          var col = palette[(Math.random() * palette.length) | 0];
          var b = rand(0.25, 0.6);
          setP(sys, i, p1, p1, p1, [col[0] * b, col[1] * b, col[2] * b], rand(0.012, 0.026));
          sys.delay[i] = 0;
        }
        return sys;
      }

      /* ----- 背景星 ----- */
      function buildStars(count) {
        var sys = makeSystem(count);
        for (var i = 0; i < count; i++) {
          var ang = Math.random() * Math.PI * 2;
          var el = rand(-0.05, 1.2);
          var R = rand(30, 55);
          var p1 = [Math.cos(ang) * Math.cos(el) * R, Math.sin(el) * R - 2, -Math.abs(Math.sin(ang)) * Math.cos(el) * R - rand(4, 20)];
          var b = rand(0.35, 1.0);
          var tint = Math.random();
          var col = tint < 0.75 ? [b, b * 0.97, b * 1.02] : tint < 0.88 ? [b * 0.9, b * 0.8, b * 1.15] : [b * 1.1, b * 0.88, b * 0.98];
          setP(sys, i, p1, p1, p1, col, rand(0.05, 0.16));
          sys.delay[i] = 0;
        }
        return sys;
      }

      /* ----- 背景烟花：17 组定时绽放（64 秒一轮，约每 3.8 秒一朵，
         其中两处近乎同时双开，粉/金/白），形成动画完成后才由 uGate
         放行，位置/速度/时刻全在着色器里算 ----- */
      var FW_CYCLE = 64;
      function buildFireworks() {
        var bursts = [
          { o: [-3.4, 2.9, -2.4], s: 2 }, { o: [3.6, 3.3, -2.8], s: 5 },
          { o: [-4.2, 2.2, -2.0], s: 9 }, { o: [4.3, 2.6, -3.2], s: 9.4 },
          { o: [-2.6, 3.6, -3.0], s: 13 }, { o: [2.9, 2.1, -2.2], s: 17 },
          { o: [-3.9, 3.1, -2.6], s: 21 }, { o: [4.0, 3.5, -2.5], s: 25 },
          { o: [-3.1, 2.5, -3.4], s: 29 }, { o: [3.3, 3.0, -2.6], s: 33 },
          { o: [-4.4, 3.4, -2.8], s: 37 }, { o: [2.5, 2.4, -3.1], s: 41 },
          { o: [-2.8, 2.7, -2.3], s: 45 }, { o: [4.4, 2.9, -3.0], s: 45.5 },
          { o: [-3.6, 3.2, -3.2], s: 50 }, { o: [3.0, 3.6, -2.4], s: 55 },
          { o: [-4.0, 2.4, -2.7], s: 60 }
        ];
        var palette = [[1.0, 0.75, 0.90], [1.05, 0.95, 1.0], [1.0, 0.55, 0.80], [1.0, 0.78, 0.42], [0.95, 0.80, 1.0]];
        var per = 110, n = bursts.length * per;
        var origin = new Float32Array(n * 3), vel = new Float32Array(n * 3),
            col = new Float32Array(n * 3), start = new Float32Array(n),
            life = new Float32Array(n), size = new Float32Array(n);
        var idx = 0;
        for (var b = 0; b < bursts.length; b++) {
          var c = palette[b % palette.length];
          for (var j = 0; j < per; j++, idx++) {
            origin.set(bursts[b].o, idx * 3);
            var th = Math.random() * Math.PI * 2;
            var ph = Math.acos(rand(-1, 1));
            var sp = rand(0.7, 1.9) * Math.sin(ph);
            vel.set([Math.cos(th) * sp, Math.cos(ph) * rand(0.7, 1.9), Math.sin(th) * sp], idx * 3);
            var cb = rand(0.85, 1.5);
            col.set([c[0] * cb, c[1] * cb, c[2] * cb], idx * 3);
            start[idx] = bursts[b].s + rand(0, 0.3);
            life[idx] = rand(1.6, 2.4);
            size[idx] = rand(0.03, 0.075);
          }
        }
        return { n: n, data: [origin, vel, col, start, life, size] };
      }

      /* ----- 开场时空隧道：数百条细光线从中心向外加速冲过镜头（每条 2 个顶点） ----- */
      function buildTunnel(count) {
        var data = new Float32Array(count * 2 * 4), rad = new Float32Array(count * 2),
            tint = new Float32Array(count * 2);
        for (var i = 0; i < count; i++) {
          var ang = Math.random() * Math.PI * 2;
          var off = Math.random();
          var spd = rand(0.7, 1.5);
          var rd = rand(0.5, 1.25), tn = Math.random();
          for (var e = 0; e < 2; e++) {
            data.set([ang, off, spd, e], (i * 2 + e) * 4);
            rad[i * 2 + e] = rd;
            tint[i * 2 + e] = tn;
          }
        }
        return { n: count, data: data, rad: rad, tint: tint };
      }

      /* ----- 隧道细尘：与光线同场的细小光点，一起向镜头呼啸冲过 ----- */
      function buildTunnelDust(count) {
        var data = new Float32Array(count * 4), rad = new Float32Array(count), size = new Float32Array(count);
        for (var i = 0; i < count; i++) {
          data.set([Math.random() * Math.PI * 2, Math.random(), rand(0.7, 1.5), 0], i * 4);
          rad[i] = rand(0.4, 1.3);
          size[i] = rand(0.012, 0.034);
        }
        return { n: count, data: data, rad: rad, size: size };
      }

      /* ----- 开场中心光核：小而暗的一簇辉光点（只作隧道深处的微光） ----- */
      var CORE_N = 26;
      function buildCore() {
        var cPos = new Float32Array(CORE_N * 3), cSize = new Float32Array(CORE_N);
        for (var j = 0; j < CORE_N; j++) {
          cPos.set([rand(-0.04, 0.04), 1.5 + rand(-0.04, 0.04), rand(-0.04, 0.04)], j * 3);
          cSize[j] = rand(0.45, 1.05);
        }
        return { cPos: cPos, cSize: cSize };
      }

      /* ----- 遮挡体几何：与树身同轴的圆锥台网格（半径为树表的 93%，略在表面之内），
         只写深度不写颜色，让螺旋带的背面段被真实遮挡 ----- */
      function buildOccluder() {
        var SEG = 40, RINGS = 20;
        var pos = [], idx = [];
        for (var s = 0; s <= RINGS; s++) {
          var h = s / RINGS;
          var y = BASE_Y + 0.02 + h * (TREE_H - 0.10);
          var hh = clamp((y - BASE_Y) / TREE_H, 0, 1);
          var r = Math.max(0.012, radiusAt(hh) * 0.93);
          for (var k = 0; k <= SEG; k++) {
            var a = k / SEG * Math.PI * 2;
            pos.push(Math.cos(a) * r, y, Math.sin(a) * r);
          }
        }
        for (var s2 = 0; s2 < RINGS; s2++) for (var k2 = 0; k2 < SEG; k2++) {
          var a0 = s2 * (SEG + 1) + k2, b0 = a0 + SEG + 1;
          idx.push(a0, b0, a0 + 1, b0, b0 + 1, a0 + 1);
        }
        return { pos: new Float32Array(pos), idx: new Uint16Array(idx) };
      }

      /* ----- 背景流星：8 颗错峰循环（周期 8 秒，间隔更短、偶有双星
         近乎同时划过），每颗 42 个拖尾点，头亮尾淡、斜穿背景天空；
         位置/轨迹全在着色器里按 uTime 算 ----- */
      function buildMeteors() {
        var defs = [
          { o: [-4.6, 4.3, -7.0], v: [3.4, -2.0, 0], off: 0.0 },
          { o: [4.8, 3.9, -8.0], v: [-3.8, -1.7, 0], off: 1.1 },
          { o: [-1.5, 4.6, -6.0], v: [2.8, -2.2, 0], off: 2.4 },
          { o: [5.2, 4.5, -7.5], v: [-3.0, -2.4, 0], off: 3.2 },
          { o: [-5.0, 3.4, -8.5], v: [3.9, -1.5, 0], off: 4.3 },
          { o: [2.2, 4.7, -6.5], v: [-3.3, -2.1, 0], off: 5.2 },
          { o: [-3.8, 4.8, -7.2], v: [3.1, -2.3, 0], off: 6.3 },
          { o: [5.4, 3.6, -6.8], v: [-3.6, -1.9, 0], off: 7.2 }
        ];
        var TRAIL = 42, n = defs.length * TRAIL;
        var origin = new Float32Array(n * 3), vel = new Float32Array(n * 3), param = new Float32Array(n * 4);
        var idx = 0;
        for (var m = 0; m < defs.length; m++) {
          for (var j = 0; j < TRAIL; j++, idx++) {
            var lag = j / (TRAIL - 1);
            origin.set(defs[m].o, idx * 3);
            vel.set(defs[m].v, idx * 3);
            param.set([defs[m].off, lag, 0.16 - 0.11 * lag, rand(0.75, 1.1)], idx * 4);
          }
        }
        return { n: n, data: [origin, vel, param] };
      }

      /* ----- 开场扩散球壳：光核之后粒子先涨成一层球壳，再螺旋汇聚成树 ----- */
      function buildShell(count) {
        var dir = new Float32Array(count * 3), col = new Float32Array(count * 3), size = new Float32Array(count);
        for (var i = 0; i < count; i++) {
          var th = Math.random() * Math.PI * 2;
          var ph = Math.acos(rand(-1, 1));
          var sp = Math.sin(ph);
          dir.set([Math.cos(th) * sp, Math.cos(ph), Math.sin(th) * sp], i * 3);
          var b = rand(0.5, 1.1);
          if (Math.random() < 0.8) col.set([1.02 * b, 0.80 * b, 0.94 * b], i * 3);
          else col.set([0.92 * b, 0.82 * b, 1.05 * b], i * 3);
          size[i] = rand(0.02, 0.05);
        }
        return { n: count, dir: dir, col: col, size: size };
      }

      /* ============================================================
         着色器
         ============================================================ */
      var BG_VERT = [
        "attribute vec2 aXY;",
        "varying vec2 vUv;",
        "void main(){ vUv = aXY*0.5+0.5; gl_Position = vec4(aXY, 0.999, 1.0); }"
      ].join("\n");

      var BG_FRAG = [
        "precision highp float;",
        "varying vec2 vUv;",
        "uniform float uTime;",
        "uniform vec2 uHalo;",
        "uniform sampler2D uCodeTex;",
        "float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453123); }",
        "float noise(vec2 p){",
        "  vec2 i = floor(p), f = fract(p);",
        "  f = f*f*(3.0-2.0*f);",
        "  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x),",
        "             mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);",
        "}",
        "float fbm(vec2 p){",
        "  float v = 0.0, a = 0.55;",
        "  for(int k=0;k<4;k++){ v += a*noise(p); p = p*2.13 + 17.7; a *= 0.5; }",
        "  return v;",
        "}",
        "void main(){",
        "  vec2 uv = vUv;",
        // 近黑深紫竖向渐变（#0d0214 → #1a0530）
        "  vec3 col = mix(vec3(0.030,0.004,0.055), vec3(0.051,0.008,0.078), smoothstep(0.0,0.65,uv.y));",
        "  col = mix(col, vec3(0.102,0.020,0.188), smoothstep(0.55,1.05,uv.y)*0.8);",
        // 两侧极淡紫色星云
        "  float nL = fbm(uv*vec2(3.0,4.2) + vec2(1.7,0.4) + uTime*0.004);",
        "  float mL = smoothstep(0.52,0.95,nL) * smoothstep(0.85,0.15,uv.x) * smoothstep(0.05,0.55,uv.y);",
        "  col += vec3(0.42,0.12,0.62) * mL * 0.4;",
        "  float nR = fbm(uv*vec2(3.4,3.8) + vec2(8.3,2.9) - uTime*0.003);",
        "  float mR = smoothstep(0.52,0.95,nR) * smoothstep(0.25,0.95,uv.x) * smoothstep(0.10,0.6,uv.y);",
        "  col += vec3(0.30,0.10,0.55) * mR * 0.38;",
        // 左右边缘的真实代码文字列（画布纹理里的真字，非伪字形）：
        // 纹理本身已把代码排在左右两列、中央留空，缓慢上滚，全程可见
        "  float edge = clamp(smoothstep(0.44,0.18,uv.x) + smoothstep(0.56,0.74,uv.x), 0.0, 1.0);",
        "  vec2 cuv = vec2(uv.x, uv.y - uTime*0.008);",
        "  vec4 codeTex = texture2D(uCodeTex, cuv);",
        "  col += codeTex.rgb * codeTex.a * edge * 0.50;",
        // 树顶星后的粉色光晕
        "  float d = length((uv - uHalo)*vec2(1.35,1.0));",
        "  col += vec3(0.90,0.35,0.62) * exp(-d*d*9.0) * 0.30;",
        "  col += vec3(0.55,0.25,0.80) * exp(-d*d*3.0) * 0.12;",
        // 底部微光 + 暗角
        "  col += vec3(0.16,0.06,0.26) * smoothstep(0.30,0.0,uv.y) * 0.30;",
        "  float vig = smoothstep(1.25, 0.45, length(uv-vec2(0.5,0.46)));",
        "  col *= 0.72 + 0.28*vig;", // 暗角收轻，避免把两侧代码列压到看不见
        "  gl_FragColor = vec4(col, 1.0);",
        "}"
      ].join("\n");

      // 粒子顶点着色器：形成动画（pos0→pos1）之后再叠加手势散开（→pos2）
      var SCATTER_SNIPPET = [
        "  float st = clamp(uScatter*1.6 - aDelay*0.75, 0.0, 1.0);",
        "  st = st*st*(3.0-2.0*st);",
        "  pos = mix(pos, aPos2, st);",
        // 散开/聚合途中绕轴甩一圈：聚合时即是快速版的螺旋汇聚，不是直线 lerp
        "  float swg = sin(st*3.14159)*0.85;",
        "  float cg = cos(swg), sg = sin(swg);",
        "  pos.xz = mat2(cg,-sg,sg,cg)*pos.xz;",
        "  float swA = st * uTime * 0.05;",
        "  float cw = cos(swA), sw = sin(swA);",
        "  pos.xz = mat2(cw,-sw,sw,cw)*pos.xz;"
      ].join("\n");

      var PT_VERT = [
        "attribute vec3 aPos0;",
        "attribute vec3 aPos1;",
        "attribute vec3 aPos2;",
        "attribute vec3 aColor;",
        "attribute float aSize;",
        "attribute float aPhase;",
        "attribute float aDelay;",
        "uniform mat4 uProj;",
        "uniform mat4 uMV;",
        "uniform float uTime, uForm, uScatter, uScale, uSizeMul, uBrightMul, uSway, uTwinkle, uPulse, uAlpha, uTravel, uSwirl, uArc;",
        "varying vec3 vColor;",
        "varying float vA;",
        "void main(){",
        "  float t = clamp((uForm - aDelay) / uTravel, 0.0, 1.0);",
        "  float te = t*t*(3.0-2.0*t);",
        "  vec3 pos = mix(aPos0, aPos1, te);",
        SCATTER_SNIPPET,
        // 螺旋汇聚：飞行前段绕树轴大角度旋转，随落位衰减到 0
        "  float ang = pow(1.0-te, 1.6) * uSwirl;",
        "  float ca = cos(ang), sa = sin(ang);",
        "  pos.xz = mat2(ca,-sa,sa,ca)*pos.xz;",
        // 中途上抛弧线：粒子先扬起再落回槽位
        "  pos.y += sin(te*3.14159) * uArc * (0.35 + 0.65*fract(aPhase*0.371));",
        "  pos.x += sin(uTime*0.7 + aPhase)*uSway;",
        "  pos.z += cos(uTime*0.55 + aPhase*1.31)*uSway;",
        "  pos.y += sin(uTime*0.5 + aPhase*0.7)*uSway*0.6;",
        "  float twp = 0.5 + 0.5*sin(uTime*(1.4+fract(aPhase*0.618)*2.6) + aPhase*7.0);",
        "  float tw = 1.0 - uTwinkle + uTwinkle*(0.30 + 0.70*twp*twp);",
        "  vColor = aColor * tw * uBrightMul * uPulse;",
        "  vA = uAlpha * (0.25 + 0.75*t);",
        "  vec4 mv = uMV * vec4(pos, 1.0);",
        "  gl_Position = uProj * mv;",
        "  float ps = aSize * uSizeMul * uPulse * uScale / max(0.1, -mv.z);",
        "  gl_PointSize = clamp(ps, 1.0, 150.0);",
        "}"
      ].join("\n");

      var PT_FRAG = [
        "precision mediump float;",
        "varying vec3 vColor;",
        "varying float vA;",
        "void main(){",
        "  vec2 q = gl_PointCoord - 0.5;",
        "  float d2 = dot(q,q)*4.0;",
        "  float a = (exp(-d2*5.0) + exp(-d2*1.7)*0.32) * vA;",
        "  a *= 1.0 - smoothstep(0.45, 1.0, d2);", // 辉光在贴图内提前衰减到 0，杜绝方形框边
        "  if(a < 0.004) discard;",
        "  gl_FragColor = vec4(vColor * a, 1.0);",
        "}"

      var SP_VERT = [
        "attribute vec3 aPos0;",
        "attribute vec3 aPos1;",
        "attribute vec3 aPos2;",
        "attribute vec3 aColor;",
        "attribute float aSize;",
        "attribute float aPhase;",
        "attribute float aDelay;",
        "uniform mat4 uProj;",
        "uniform mat4 uMV;",
        "uniform float uTime, uForm, uScatter, uScale, uTravel, uSwirl, uArc;",
        "varying vec3 vColor;",
        "varying float vTw;",
        "void main(){",
        "  float t = clamp((uForm - aDelay) / uTravel, 0.0, 1.0);",
        "  float te = t*t*(3.0-2.0*t);",
        "  vec3 pos = mix(aPos0, aPos1, te);",
        SCATTER_SNIPPET,
        "  float ang = pow(1.0-te, 1.6) * uSwirl;",
        "  float ca = cos(ang), sa = sin(ang);",
        "  pos.xz = mat2(ca,-sa,sa,ca)*pos.xz;",
        "  pos.y += sin(te*3.14159) * uArc * (0.35 + 0.65*fract(aPhase*0.371));",
        "  float pulse = 0.5 + 0.5*sin(uTime*(0.9+fract(aPhase*0.377)*1.6) + aPhase*9.0);",
        "  vTw = (0.10 + 0.90*pulse*pulse*pulse) * t;",
        "  vColor = aColor;",
        "  vec4 mv = uMV * vec4(pos, 1.0);",
        "  gl_Position = uProj * mv;",
        "  gl_PointSize = clamp(aSize * uScale / max(0.1,-mv.z), 1.0, 190.0);",
        "}"
      ].join("\n");

      var SP_FRAG = [
        "precision mediump float;",
        "varying vec3 vColor;",
        "varying float vTw;",
        "void main(){",
        "  vec2 p = gl_PointCoord*2.0 - 1.0;",
        "  float ax = max(0.0, 1.0-abs(p.x)), ay = max(0.0, 1.0-abs(p.y));",
        "  float star = pow(ax,10.0)*pow(ay,2.2) + pow(ay,10.0)*pow(ax,2.2);",
        "  vec2 q = mat2(0.7071,-0.7071,0.7071,0.7071)*p;",
        "  float bx = max(0.0, 1.0-abs(q.x)), by = max(0.0, 1.0-abs(q.y));",
        "  star += 0.45*(pow(bx,12.0)*pow(by,3.0) + pow(by,12.0)*pow(bx,3.0));",
        "  float core = exp(-dot(p,p)*5.0)*0.9;",
        "  float a = (star*1.15 + core) * vTw;",

      // 开场时空隧道：每条光线都是穿过光核正中心 (0,1.5,0) 的一条三维射线——
      // 头尾两端共用同一方向 dir、只差距离 s，投影后必然从光核中心放射；
      // 加速曲线放缓，呈平稳庄重的穿越感，无旋拧
      var TUNNEL_VERT = [
        "attribute vec4 aData;", // x 角度 / y 相位偏移 / z 速度 / w 端点（0 头 1 尾）
        "attribute float aRad;",
        "attribute float aTint;",
        "uniform mat4 uProj;",
        "uniform mat4 uMV;",
        "uniform float uT;",
        "varying vec3 vColor;",
        "varying float vA;",
        "void main(){",
        "  float prog = uT*0.50 + uT*uT*uT*0.85;", // 缓加速：起步稳、后段才提速，最高速远低于旧版
        "  float ph = fract(aData.y + prog * aData.z);",
        "  float p = max(ph - aData.w * (0.05 + 0.10*ph), 0.0);", // 尾端沿同一射线滞后 → 线段仍指向光核中心
        "  float s = pow(p, 1.3) * 6.5 * aRad;",
        "  vec3 dir = vec3(cos(aData.x)*0.62, sin(aData.x)*0.55, 1.0);", // 方向只由角度决定，头尾一致
        "  vec3 pos = vec3(0.0, 1.5, 0.0) + dir * s;", // 起点就是光核正中心，与光核精灵同点
        "  vColor = mix(vec3(1.0, 0.50, 0.82), vec3(1.06, 0.95, 1.02), aTint);",
        "  float env = smoothstep(0.02, 0.16, ph) * (1.0 - smoothstep(0.75, 0.97, ph));",
        "  vA = env * mix(1.0, 0.16, aData.w) * smoothstep(0.0, 0.05, uT) * (1.0 - smoothstep(0.78, 1.0, uT));",
        "  gl_Position = uProj * uMV * vec4(pos, 1.0);",
        "}"
      ].join("\n");

        "precision mediump float;",
        "varying vec3 vColor;",
        "varying float vA;",
        "void main(){",
        "  gl_FragColor = vec4(vColor * vA * 0.9, 1.0);",
        "}"

      // 隧道细尘点：与光线同一套射线公式（同源点、同缓加速），点状呈现（与 PT_FRAG 共用软点片元）
      var TUNNEL_PT_VERT = [
        "attribute vec4 aData;", // x 角度 / y 相位偏移 / z 速度 / w 未用
        "attribute float aRad;",
        "attribute float aSize;",
        "uniform mat4 uProj;",
        "uniform mat4 uMV;",
        "uniform float uT, uScale;",
        "varying vec3 vColor;",
        "varying float vA;",
        "void main(){",
        "  float prog = uT*0.50 + uT*uT*uT*0.85;",
        "  float ph = fract(aData.y + prog * aData.z);",
        "  float s = pow(ph, 1.3) * 6.5 * aRad;",
        "  vec3 dir = vec3(cos(aData.x)*0.62, sin(aData.x)*0.55, 1.0);",
        "  vec3 pos = vec3(0.0, 1.5, 0.0) + dir * s;", // 同样从光核正中心出发
        "  vColor = mix(vec3(1.0, 0.55, 0.84), vec3(1.05, 0.96, 1.02), fract(aData.x*2.39));",
        "  float env = smoothstep(0.02, 0.16, ph) * (1.0 - smoothstep(0.75, 0.97, ph));",
        "  vA = env * 0.55 * smoothstep(0.0, 0.05, uT) * (1.0 - smoothstep(0.78, 1.0, uT));",
        "  vec4 mv = uMV * vec4(pos, 1.0);",
        "  gl_Position = uProj * mv;",
        "  gl_PointSize = clamp(aSize * uScale / max(0.1,-mv.z), 1.0, 40.0);",
        "}"
      ].join("\n");

      // 开场中心光核：品红辉光点
      var CORE_VERT = [
        "attribute vec3 aPos;",
        "attribute float aSize;",
        "uniform mat4 uProj;",
        "uniform mat4 uMV;",
        "uniform float uScale, uA;",
        "varying float vA;",
        "void main(){",
        "  vA = uA;",
        "  vec4 mv = uMV * vec4(aPos, 1.0);",
        "  gl_Position = uProj * mv;",
        "  gl_PointSize = clamp(aSize * uScale / max(0.1,-mv.z), 1.0, 340.0);",
        "}"
      ].join("\n");

      var CORE_FRAG = [
        "precision mediump float;",
        "uniform vec3 uColor;",
        "varying float vA;",
        "void main(){",
        "  vec2 q = gl_PointCoord - 0.5;",
        "  float d2 = dot(q,q)*4.0;",
        "  float a = (exp(-d2*5.5) + exp(-d2*2.2)*0.30) * vA;",
        "  a *= 1.0 - smoothstep(0.40, 0.95, d2);", // 边缘归零：光核再亮也不露方框
        "  if(a < 0.004) discard;",
        "  gl_FragColor = vec4(uColor * a, 1.0);",
        "}"

      var SHELL_VERT = [
        "attribute vec3 aDir;",
        "attribute vec3 aColor;",
        "attribute float aSize;",
        "uniform mat4 uProj;",
        "uniform mat4 uMV;",
        "uniform float uT, uScale;",
        "varying vec3 vColor;",
        "varying float vA;",
        "void main(){",
        "  float e = 1.0 - pow(1.0 - uT, 2.2);",
        "  float r = mix(0.25, 4.9, e);",
        "  float ang = uT * 1.1;",
        "  float ca = cos(ang), sa = sin(ang);",
        "  vec3 d = aDir;",
        "  d.xz = mat2(ca,-sa,sa,ca)*d.xz;",
        "  vec3 pos = vec3(0.0, 1.5, 0.0) + d * vec3(r, r*0.82, r);",
        "  vColor = aColor;",
        "  vA = smoothstep(0.0, 0.12, uT) * (1.0 - smoothstep(0.62, 1.0, uT)) * 0.85;",
        "  vec4 mv = uMV * vec4(pos, 1.0);",
        "  gl_Position = uProj * mv;",
        "  gl_PointSize = clamp(aSize * uScale / max(0.1,-mv.z), 1.0, 64.0);",
        "}"
      ].join("\n");

      // 两侧烟花：年龄由 uTime 与每粒子的起始时刻决定，过期自动隐藏
      var FW_VERT = [
        "attribute vec3 aOrigin;",
        "attribute vec3 aVel;",
        "attribute vec3 aColor;",
        "attribute float aStart;",
        "attribute float aLife;",
        "attribute float aSize;",
        "uniform mat4 uProj;",
        "uniform mat4 uMV;",
        "uniform float uTime, uScale, uGate;",
        "varying vec3 vColor;",
        "varying float vA;",

        "  float age = mod(uTime, 64.0) - aStart;",

        "  vec3 pos = aOrigin + aVel*age + vec3(0.0, -0.22, 0.0)*age*age;",
        "  vColor = aColor;",
        "  vA = dead ? 0.0 : (1.0-k)*(1.0-k)*uGate;",
        "  vec4 mv = uMV * vec4(pos, 1.0);",
        "  gl_Position = dead ? vec4(0.0, 0.0, -3.0, 1.0) : uProj * mv;",
        "  gl_PointSize = dead ? 0.0 : clamp(aSize * uScale / max(0.1,-mv.z), 1.0, 42.0);",
        "}"
      ].join("\n");

      var FW_FRAG = [
        "precision mediump float;",
        "varying vec3 vColor;",
        "varying float vA;",
        "void main(){",
        "  vec2 q = gl_PointCoord - 0.5;",
        "  float d2 = dot(q,q)*4.0;",
        "  float a = (exp(-d2*5.0) + exp(-d2*1.7)*0.32) * vA;",
        "  if(a < 0.004) discard;",
        "  gl_FragColor = vec4(vColor * a, 1.0);",
        "}"
      ].join("\n");

      // 背景流星：亮头 + 长拖尾斜穿天幕，uGate 控制「形成完成后才出现」
      var METEOR_VERT = [
        "attribute vec3 aOrigin;",
        "attribute vec3 aVel;",
        "attribute vec4 aParam;", // x 周期偏移 / y 拖尾滞后 0..1 / z 尺寸 / w 亮度
        "uniform mat4 uProj;",
        "uniform mat4 uMV;",
        "uniform float uTime, uScale, uGate;",
        "varying vec3 vColor;",
        "varying float vA;",
        "void main(){",
        "  float DUR = 1.6;",
        "  float lt = mod(uTime + aParam.x, 8.0);",
        "  bool act = lt < DUR;",
        "  float pr = clamp(lt / DUR, 0.0, 1.0);",
        "  vec3 head = aOrigin + aVel * lt;",
        "  vec3 pos = head - aVel * aParam.y * 0.5;",
        "  float env = sin(3.14159 * pr);",
        "  vA = act ? env * pow(1.0 - aParam.y, 1.6) * aParam.w * uGate : 0.0;",
        "  vColor = mix(vec3(1.06, 0.99, 1.02), vec3(1.0, 0.60, 0.84), aParam.y);",
        "  vec4 mv = uMV * vec4(pos, 1.0);",
        "  gl_Position = act ? uProj * mv : vec4(0.0, 0.0, -3.0, 1.0);",
        "  gl_PointSize = act ? clamp(aParam.z * (1.0 - aParam.y*0.72) * uScale / max(0.1,-mv.z), 1.0, 90.0) : 0.0;",
        "}"
      ].join("\n");

      // 遮挡体：只写深度（颜色写入在绘制时关闭），uRad 随形成/散开缩放半径
      var OCC_VERT = [
        "attribute vec3 aPos;",
        "uniform mat4 uProj;",
        "uniform mat4 uMV;",
        "uniform float uRad;",
        "void main(){",

        "precision mediump float;",
        "void main(){ gl_FragColor = vec4(0.0); }"

        "attribute vec2 aXY;",
        "attribute vec2 aUV;",
        "uniform mat4 uMVP;",
        "varying vec2 vUv;",
        "void main(){",
        "  vUv = aUV;",
        "  gl_Position = uMVP * vec4(aXY, 0.0, 1.0);",
        "}"

        "precision mediump float;",
        "varying vec2 vUv;",
        "uniform sampler2D uTex;",
        "uniform float uAlpha;",
        "void main(){",
        "  vec4 c = texture2D(uTex, vUv);",
        "  gl_FragColor = vec4(c.rgb, c.a * uAlpha);",
        "}"

      /* ============================================================
         WebGL 初始化

      var canvas = document.getElementById("scene");
      var gl = canvas.getContext("webgl", { antialias: false, alpha: false, depth: true, stencil: false }) ||

      function compile(type, src) {

      var coreProg = makeProgram(CORE_VERT, CORE_FRAG, ["aPos", "aSize"]);
      var shellProg = makeProgram(SHELL_VERT, PT_FRAG, ["aDir", "aColor", "aSize"]);
      var fwProg = makeProgram(FW_VERT, FW_FRAG, ["aOrigin", "aVel", "aColor", "aStart", "aLife", "aSize"]);

      function upload(sys) {

          gl.bindBuffer(gl.ARRAY_BUFFER, b);

      var isCoarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

      var occPosBuf = makeBuf(occGeo.pos);

      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, occIdxBuf);

      /* ----- 背景代码纹理：真实代码文字（画布 2D 绘制 → WebGL 纹理） -----

      var CODE_LINES = [
        "// particle-christmas-tree.js",
